<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cellular Evolution Clicker</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20260%20260%22%3E%3Cdefs%3E%3CradialGradient%20id=%22bg%22%20cx=%22130%22%20cy=%22130%22%20r=%22184%22%20gradientUnits=%22userSpaceOnUse%22%3E%3Cstop%20offset=%220%22%20stop-color=%22%234b6a9e%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22%231a2744%22/%3E%3C/radialGradient%3E%3CradialGradient%20id=%22c%22%20cx=%2290%22%20cy=%2290%22%20r=%22198%22%20gradientUnits=%22userSpaceOnUse%22%3E%3Cstop%20offset=%220%22%20stop-color=%22%2360a5fa%22/%3E%3Cstop%20offset=%220.5%22%20stop-color=%22%232563eb%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22%231e3a8a%22/%3E%3C/radialGradient%3E%3CclipPath%20id=%22k%22%3E%3Ccircle%20cx=%22130%22%20cy=%22130%22%20r=%22100%22/%3E%3C/clipPath%3E%3Cfilter%20id=%22b25%22%20x=%22-100%25%22%20y=%22-100%25%22%20width=%22300%25%22%20height=%22300%25%22%3E%3CfeGaussianBlur%20stdDeviation=%2225%22/%3E%3C/filter%3E%3Cfilter%20id=%22b15%22%20x=%22-20%25%22%20y=%22-20%25%22%20width=%22140%25%22%20height=%22140%25%22%3E%3CfeGaussianBlur%20stdDeviation=%2215%22/%3E%3C/filter%3E%3C/defs%3E%3Crect%20x=%222.5%22%20y=%222.5%22%20width=%22255%22%20height=%22255%22%20rx=%2258%22%20fill=%22url%28%23bg%29%22%20stroke=%22%2360a5fa%22%20stroke-width=%225%22/%3E%3Ccircle%20cx=%22130%22%20cy=%22130%22%20r=%22100%22%20fill=%22%232563eb%22%20opacity=%220.4%22%20filter=%22url%28%23b25%29%22/%3E%3Ccircle%20cx=%22130%22%20cy=%22130%22%20r=%22100%22%20fill=%22url%28%23c%29%22/%3E%3Cg%20clip-path=%22url%28%23k%29%22%3E%3Cpath%20transform=%22translate%28-10%20-10%29%22%20fill=%22%23000%22%20fill-opacity=%220.7%22%20fill-rule=%22evenodd%22%20filter=%22url%28%23b15%29%22%20d=%22M-200%20-200H460V460H-200ZM30%20130%20a100%20100%200%201%200%20200%200%20a100%20100%200%201%200%20-200%200Z%22/%3E%3Cpath%20transform=%22translate%2815%2015%29%22%20fill=%22%23fff%22%20fill-opacity=%220.2%22%20fill-rule=%22evenodd%22%20filter=%22url%28%23b15%29%22%20d=%22M-200%20-200H460V460H-200ZM30%20130%20a100%20100%200%201%200%20200%200%20a100%20100%200%201%200%20-200%200Z%22/%3E%3C/g%3E%3Ccircle%20cx=%22130%22%20cy=%22130%22%20r=%2298%22%20fill=%22none%22%20stroke=%22%233b82f6%22%20stroke-opacity=%220.7%22%20stroke-width=%224%22/%3E%3C/svg%3E">
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --border: #334155;
            --accent-primary: #3b82f6;
            --accent-success: #10b981;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;

            /* Rebirth palette */
            --rebirth: #BF40BF;
            --rebirth-border: #9932cc;
            --rebirth-bg: #15011a;
            --rebirth-text: #e7c6ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        button { -webkit-tap-highlight-color: transparent; }

        /* ================= Header ================= */
        header {
            position: relative;
            z-index: 10;
            background: linear-gradient(180deg, #212d42 0%, var(--panel-bg) 100%);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            box-shadow: 0 4px 14px -4px rgba(0, 0, 0, 0.45);
        }
        /* Soft accent line riding on the header border */
        header::after {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: -2px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.45), rgba(191, 64, 191, 0.35), transparent);
            pointer-events: none;
        }

        .logo {
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(to right, #3b82f6, #5196b4);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats-container { text-align: right; }

        .currency-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 1.1rem;
        }
        .currency-divider {
            width: 1px;
            height: 1.7rem;
            background: linear-gradient(transparent, #475569, transparent);
        }

        #dna-counter,
        #rdna-counter {
            display: inline-block;
            font-size: 2rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            transform-origin: right center;
            white-space: nowrap;
        }
        #dna-counter {
            color: var(--accent-success);
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }
        #rdna-counter {
            color: var(--rebirth);
            text-shadow: 0 0 12px rgba(191, 64, 191, 0.3);
        }
        .bump { animation: bump 0.32s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes bump {
            0%   { transform: scale(1); }
            40%  { transform: scale(1.07); }
            100% { transform: scale(1); }
        }

        #dps-counter {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        /* DNA currency symbol (replaces the $ sign everywhere) */
        .dna-icon {
            display: inline-block;
            height: 0.9em;
            width: 0.55em;
            vertical-align: -0.1em;
            margin-right: 0.12em;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            overflow: visible;
            pointer-events: none;
        }
        .dna-icon .rung { stroke-width: 1.3; opacity: 0.85; }
        /* RNA symbol: bars as bold as the strand, like the reference */
        .rna-icon { width: 0.66em; }
        .rna-icon path { stroke-width: 110; } /* main strand: a little bolder than the DNA helix strands */
        .rna-icon .rung { stroke-width: 78; opacity: 1; }

        /* ================= Layout ================= */
        .game-layout {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .simulation-pane {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            overflow: hidden;
            isolation: isolate;
        }

        /* Canvases: ambient plankton behind the cells, floating yields above them */
        .pane-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #ambient-canvas { z-index: 0; }
        #fx-canvas { z-index: 5; }

        /* Every colony lives on its own screen; JS slides them horizontally */
        .screen-track { position: absolute; inset: 0; z-index: 1; }
        .screen {
            position: absolute;
            inset: 0;
            will-change: transform, opacity;
        }
        .screen.offscreen {
            visibility: hidden;
            content-visibility: hidden;
        }
        .screen-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            transition: filter 0.45s ease;
        }
        .screen.locked .screen-content {
            filter: grayscale(1) brightness(0.5);
            pointer-events: none;
        }
        .screen.dormant .screen-content { filter: grayscale(1) brightness(0.62); }

        .stage-badge {
            position: absolute;
            top: 2rem;
            z-index: 2;
            background-color: #1e293b;
            border: 1px solid #475569;
            padding: 0.5rem 1.5rem;
            border-radius: 9999px;
            font-weight: 600;
            letter-spacing: 0.5px;
            white-space: nowrap;
            box-shadow: 0 4px 14px -6px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }
        /* Clickable: opens the stage list. Extra bottom padding makes room for the progress bar. */
        .stage-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1.15rem 0.7rem 1.5rem;
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
        }
        .stage-badge:hover,
        .stage-badge.open { border-color: #64748b; background-color: #26334a; }
        .stage-badge:focus-visible { outline: 2px solid var(--accent-primary); outline-offset: 2px; }
        .badge-chev {
            width: 12px;
            height: 12px;
            fill: none;
            stroke: var(--text-muted);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.25s ease;
        }
        .stage-badge.open .badge-chev { transform: rotate(180deg); }
        /* Yellow experience bar toward the next stage */
        .stage-xp {
            position: absolute;
            left: 1.1rem;
            right: 1.1rem;
            bottom: 0.3rem;
            height: 3px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }
        .stage-xp > i {
            display: block;
            height: 100%;
            width: 0;
            border-radius: inherit;
            background: #FFFF00;
            box-shadow: 0 0 6px rgba(255, 255, 0, 0.7);
            transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }
        /* Transcendent Cell: the bar becomes a flowing, star-flecked galaxy */
        .stage-xp.galaxy > i {
            background:
                radial-gradient(circle at 12% 50%, #ffffff 0 0.7px, transparent 1.3px) 0 0 / 22px 100%,
                radial-gradient(circle at 63% 40%, #ffffff 0 0.6px, transparent 1.2px) 0 0 / 31px 100%,
                linear-gradient(90deg, #4338ca, #a855f7, #ec4899, #22d3ee, #4338ca) 0 0 / 200% 100%;
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.9), 0 0 3px rgba(34, 211, 238, 0.7);
            animation: galaxyBar 5s linear infinite;
        }
        @keyframes galaxyBar {
            to { background-position: 22px 0, -31px 0, 200% 0; }
        }

        /* Stage list dropdown */
        .stage-menu {
            position: absolute;
            top: 5.4rem;
            left: 50%;
            margin-left: -160px;
            z-index: 6; /* above the floating yields canvas (5) */
            width: 320px;
            max-height: calc(100% - 7.5rem);
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 0.4rem;
            border-radius: 0.85rem;
            background: #0f172a;
            border: 1px solid #475569;
            box-shadow: 0 18px 40px -12px rgba(0, 0, 0, 0.85);
            scrollbar-width: thin;
            scrollbar-color: #475569 transparent;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-6px) scale(0.97);
            transform-origin: top center;
            transition: opacity 0.18s ease, transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 0.22s;
        }
        .stage-menu.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            transition: opacity 0.18s ease, transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), visibility 0s;
        }
        .stage-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.42rem 0.6rem;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .si-num { width: 1.4rem; text-align: right; font-variant-numeric: tabular-nums; opacity: 0.8; font-size: 0.75rem; }
        .si-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .si-name { flex: 1; }
        .si-req { font-size: 0.7rem; opacity: 0.75; font-variant-numeric: tabular-nums; }
        .stage-item.done { color: var(--accent-success); }
        .stage-item.current { color: #ffffff; background: rgba(255, 255, 255, 0.08); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14); }
        .stage-item.future { color: #64748b; cursor: default; }
        .stage-item.future .si-dot { filter: grayscale(1); opacity: 0.5; }
        .stage-item.future .si-name { letter-spacing: 2px; }

        /* Reached stages can be opened to read about them */
        .stage-item.done,
        .stage-item.current { cursor: pointer; transition: background-color 0.15s ease; }
        .stage-item.done:hover { background: rgba(16, 185, 129, 0.08); }
        .stage-item.current:hover { background: rgba(255, 255, 255, 0.12); }
        .stage-item:focus-visible { outline: 2px solid var(--accent-primary); outline-offset: -2px; }
        .si-chev {
            width: 10px;
            height: 10px;
            flex-shrink: 0;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.7;
            transition: transform 0.25s ease;
        }
        .stage-item.future .si-chev { visibility: hidden; }
        .stage-entry.expanded .si-chev { transform: rotate(180deg); }
        .stage-entry.expanded .stage-item { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }

        /* Smooth open/close of the explainer under a row */
        .stage-info {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .stage-entry.expanded .stage-info { grid-template-rows: 1fr; }
        .stage-info-inner {
            overflow: hidden;
            min-height: 0;
        }
        .stage-entry.expanded .stage-info-inner {
            margin: 0 0 0.35rem;
            padding: 0.55rem 0.7rem 0.6rem 0.8rem;
            border-left: 3px solid var(--stage-color);
            border-radius: 0 0 0.5rem 0.5rem;
            background: rgba(255, 255, 255, 0.04);
        }
        .stage-info p {
            font-size: 0.78rem;
            line-height: 1.45;
            color: #cbd5e1;
            font-weight: 400;
        }
        .stage-info .si-fact {
            margin-top: 0.45rem;
            color: #94a3b8;
        }
        .stage-info .si-fact strong { color: #FFFF00; font-weight: 700; }

        /* Transcendent Cell: galaxy-tinted name, and a corrupted description with RGB-split glitch slices */
        .stage-entry.galaxy .stage-item.current .si-name {
            background: linear-gradient(90deg, #c4b5fd, #f0abfc, #67e8f9);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .stage-info p.glitch {
            position: relative;
            color: #e9d5ff;
            line-height: 2.2; /* room for the stacked accent marks above and below each letter */
            margin: 0.3rem 0;
            animation: glitchJitter 3.1s steps(1, end) infinite;
        }
        .stage-info p.glitch::before,
        .stage-info p.glitch::after {
            content: attr(data-text);
            position: absolute;
            inset: 0;
            pointer-events: none;
            mix-blend-mode: screen;
            clip-path: inset(0 0 100% 0);
        }
        .stage-info p.glitch::before { color: #22d3ee; animation: glitchSliceA 2.3s steps(1, end) infinite; }
        .stage-info p.glitch::after  { color: #f472b6; animation: glitchSliceB 1.7s steps(1, end) infinite; }
        @keyframes glitchJitter {
            0%, 90%, 100% { transform: none; filter: none; }
            91% { transform: translateX(2px) skewX(-5deg); filter: hue-rotate(40deg); }
            93% { transform: translateX(-2px); }
            95% { transform: translateX(1px) skewX(4deg); filter: hue-rotate(-50deg); }
            97% { transform: none; filter: none; }
        }
        @keyframes glitchSliceA {
            0%   { clip-path: inset(0 0 85% 0);   transform: translateX(-3px); }
            12%  { clip-path: inset(32% 0 48% 0);  transform: translateX(2px); }
            24%  { clip-path: inset(72% 0 8% 0);   transform: translateX(-4px); }
            36%  { clip-path: inset(10% 0 78% 0);  transform: translateX(1px); }
            48%, 100% { clip-path: inset(0 0 100% 0); transform: none; }
        }
        @keyframes glitchSliceB {
            0%   { clip-path: inset(60% 0 20% 0);  transform: translateX(3px); }
            15%  { clip-path: inset(5% 0 88% 0);   transform: translateX(-2px); }
            30%  { clip-path: inset(44% 0 40% 0);  transform: translateX(4px); }
            42%  { clip-path: inset(86% 0 2% 0);   transform: translateX(-1px); }
            54%, 100% { clip-path: inset(0 0 100% 0); transform: none; }
        }

        .stage-badge.pop { animation: badgePop 0.65s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes badgePop {
            0%   { transform: scale(1); }
            30%  { transform: scale(1.12); border-color: #94a3b8; box-shadow: 0 0 22px rgba(148, 163, 184, 0.35); }
            100% { transform: scale(1); }
        }

        .cell-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: width 0.6s ease, height 0.6s ease;
            -webkit-tap-highlight-color: transparent;
        }

        /* ---------- Multicellular mass ---------- */
        .cell-mass {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 0;
            height: 0;
            transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform, filter;
        }
        /* Click cooldown dims the whole mass in one GPU-friendly filter instead of every cell */
        .cell-mass.cooldown { filter: saturate(0.5) brightness(0.7); }
        .no-anim, .no-anim * { transition: none !important; }

        .mass-layer { position: absolute; left: 0; top: 0; width: 0; height: 0; }
        .layer-features { z-index: 1; pointer-events: none; }
        .layer-bodies { z-index: 2; }
        .layer-junctions { z-index: 3; pointer-events: none; }
        .layer-fx { z-index: 4; pointer-events: none; }

        .cell-feat,
        .cell-body {
            position: absolute;
            width: 200px;
            height: 200px;
            transition: left 0.7s cubic-bezier(0.34, 1.3, 0.64, 1),
                        top 0.7s cubic-bezier(0.34, 1.3, 0.64, 1),
                        transform 0.7s cubic-bezier(0.34, 1.3, 0.64, 1),
                        opacity 0.5s ease;
        }

        .cell-feat { pointer-events: none; }

        .feat-rot {
            position: absolute;
            inset: 0;
            transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .feat-svg {
            position: absolute;
            left: -150px;
            top: -150px;
            width: 500px;
            height: 500px;
            overflow: visible;
        }

        /* Moving parts of a cell's surroundings live on their own GPU layer, so the static
           artwork around them is painted once instead of every frame */
        .feat-layer { position: absolute; inset: 0; will-change: transform; }
        .feat-spin { animation: rotate var(--dur) linear infinite; }
        .feat-spin.rev { animation-direction: reverse; }
        .feat-pulse { animation: featPulse var(--dur) ease-in-out infinite; }
        .feat-breathe { animation: featBreathe var(--dur) ease-in-out infinite; }
        @keyframes featPulse { 0%, 100% { opacity: var(--lo); } 50% { opacity: var(--hi); } }
        @keyframes featBreathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }

        /* Static outer glow for cells whose outline animates (avoids re-blurring the glow every frame) */
        .cell-glow.halo-glow::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 200px;
            height: 200px;
            margin: -100px 0 0 -100px;
            border-radius: 50%;
            box-shadow: 0 0 50px var(--halo);
            will-change: transform;
        }

        .cell-body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell-glow {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: filter 0.5s ease;
            will-change: transform;
        }

        .cell-sphere {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #60a5fa, #2563eb, #1e3a8a);
            box-shadow: 0 0 50px rgba(37, 99, 235, 0.4), inset -10px -10px 30px rgba(0,0,0,0.7), inset 15px 15px 30px rgba(255,255,255,0.2);
            transition: width 0.5s ease, height 0.5s ease, background 0.5s ease, border-radius 0.5s ease, box-shadow 0.5s ease;
            position: relative;
            z-index: 2;
        }

        .organelles {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            z-index: 1;
        }
        /* Own GPU layer, only for stages whose organelles move: animated organelles then no longer force the
           cell's big glow shadow to repaint, while static ones don't pay for an extra layer */
        .organelles.live { will-change: transform; }

        .org-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .nucleus {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #f43f5e, #be123c);
            box-shadow: inset -2px -2px 5px rgba(0,0,0,0.5);
            top: 40%;
            left: 40%;
            z-index: 3;
            opacity: 0;
            transition: opacity 0.5s, width 0.5s, height 0.5s, top 0.5s, left 0.5s, border-radius 0.5s;
        }
        .chromatin {
            position: absolute;
            border-radius: 50%;
            background: rgba(30, 27, 75, 0.38);
        }

        @keyframes rotate { 100% { transform: rotate(360deg); } }

        /* ---------- Stage-specific living details ---------- */
        .cell-sphere.amoeba { animation: amoeba 6s ease-in-out infinite; }
        @keyframes amoeba {
            0%, 100% { border-radius: 55% 45% 50% 50% / 50% 55% 45% 50%; }
            33%      { border-radius: 45% 55% 40% 60% / 60% 45% 55% 40%; }
            66%      { border-radius: 52% 48% 60% 40% / 42% 58% 48% 52%; }
        }

        .stem-sheen {
            position: absolute;
            inset: 6%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, rgba(255,255,255,0), rgba(255,255,255,0.35), rgba(255,255,255,0) 40%, rgba(255,255,255,0.2) 70%, rgba(255,255,255,0));
            animation: rotate 9s linear infinite;
        }
        .chimera-sheen {
            position: absolute;
            inset: 4%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, rgba(240,171,252,0.55), rgba(34,211,238,0.45), rgba(163,230,53,0.4), rgba(99,102,241,0.5), rgba(240,171,252,0.55));
            animation: rotate 12s linear infinite;
        }
        .galaxy-sheen {
            position: absolute;
            inset: 4%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, rgba(192,132,252,0.55), rgba(34,211,238,0.3), rgba(244,114,182,0.4), rgba(99,102,241,0.55), rgba(192,132,252,0.55));
            animation: rotate 16s linear infinite;
        }

        .junction {
            position: absolute;
            border-radius: 9999px;
            pointer-events: none;
        }
        .junction.adhesion {
            width: 30px;
            height: 12px;
            margin: -6px 0 0 -15px;
            background: linear-gradient(90deg, #fde68a, #f59e0b);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.8);
            animation: junctionPulse 2.6s ease-in-out infinite;
        }
        .junction.synapse {
            width: 64px;
            height: 4px;
            margin: -2px 0 0 -32px;
            background: linear-gradient(90deg, transparent, #d9f99d, transparent);
            box-shadow: 0 0 10px rgba(132, 204, 22, 0.9);
            animation: synapseFire 1.8s ease-in-out infinite;
        }
        @keyframes junctionPulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
        @keyframes synapseFire { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

        /* ---------- Phase change animation ---------- */
        .cell-body.evolving { animation: evolveMorph 0.9s cubic-bezier(0.34, 1.2, 0.64, 1); }
        .cell-feat.evolving { animation: evolveFeat 0.9s ease; }

        @keyframes evolveMorph {
            0%   { transform: scale(1) rotate(0deg); filter: brightness(1); }
            25%  { transform: scale(0.78) rotate(-6deg); filter: brightness(1.9) saturate(1.4); }
            45%  { transform: scale(1.14) rotate(3deg); filter: brightness(1.5); }
            70%  { transform: scale(0.96) rotate(0deg); filter: brightness(1.1); }
            100% { transform: scale(1) rotate(0deg); filter: brightness(1); }
        }
        @keyframes evolveFeat {
            0%   { transform: scale(1); opacity: 1; }
            25%  { transform: scale(0.6); opacity: 0; }
            55%  { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .evolve-ring {
            position: absolute;
            border-radius: 50%;
            border: 3px solid currentColor;
            box-shadow: 0 0 18px currentColor, inset 0 0 18px currentColor;
            animation: evolveRing 0.9s ease-out forwards;
        }
        @keyframes evolveRing {
            0%   { transform: scale(0.55); opacity: 0.9; }
            100% { transform: scale(1.7); opacity: 0; }
        }

        /* ---------- Screen navigation arrows ---------- */
        .nav-arrow {
            position: absolute;
            top: 50%;
            z-index: 6;
            width: 52px;
            height: 52px;
            margin-top: -26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.72);
            border: 1px solid rgba(148, 163, 184, 0.28);
            color: #cbd5e1;
            cursor: pointer;
            box-shadow: 0 6px 18px -6px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.25s, border-color 0.25s, color 0.25s, opacity 0.3s, box-shadow 0.25s;
        }
        .nav-arrow svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.6;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.25s ease;
        }
        .nav-arrow.left { left: 1.25rem; }
        .nav-arrow.right { right: 1.25rem; }
        .nav-arrow:hover {
            background: rgba(37, 99, 235, 0.22);
            border-color: rgba(96, 165, 250, 0.65);
            color: #ffffff;
            transform: scale(1.08);
            box-shadow: 0 6px 22px -6px rgba(37, 99, 235, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
        .nav-arrow.left:hover svg { transform: translateX(-2px); }
        .nav-arrow.right:hover svg { transform: translateX(2px); }
        .nav-arrow:active { transform: scale(0.95); }
        .nav-arrow.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
        }

        /* ---------- Locked colonies ---------- */
        .lock-overlay {
            position: absolute;
            inset: 0;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: opacity 0.45s ease, transform 0.45s ease;
        }
        .lock-overlay.gone { opacity: 0; transform: scale(1.18); }
        .lock-overlay.removed { display: none; }
        .lock-btn {
            pointer-events: auto;
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.85rem;
            color: #64748b;
            padding: 1rem 1.5rem;
            border-radius: 1rem;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .lock-btn:hover { transform: translateY(-2px) scale(1.03); }
        .lock-icon {
            width: 92px;
            height: 104px;
            overflow: visible;
            filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.55));
            transition: color 0.3s;
        }
        .lock-icon .shackle { transform-box: fill-box; transform-origin: 100% 100%; }
        .lock-icon .lock-body-g { transform-box: fill-box; transform-origin: 50% 50%; }
        .lock-price {
            display: inline-flex;
            align-items: center;
            font-weight: 800;
            font-size: 1.3rem;
            color: #94a3b8;
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid #475569;
            padding: 0.45rem 1.15rem;
            border-radius: 9999px;
            font-variant-numeric: tabular-nums;
            transition: color 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        .lock-caption {
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 700;
            transition: color 0.3s;
        }
        .lock-btn.affordable .lock-price {
            color: var(--accent-success);
            border-color: rgba(16, 185, 129, 0.55);
            box-shadow: 0 0 18px rgba(16, 185, 129, 0.22);
        }
        .lock-btn.affordable .lock-caption { color: #94a3b8; }
        .lock-btn.denied { animation: lockShake 0.4s ease; }
        .lock-btn.unlocking { pointer-events: none; }
        .lock-btn.unlocking .lock-icon { color: var(--accent-success); }
        .lock-btn.unlocking .shackle { animation: shackleOpen 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .lock-btn.unlocking .lock-body-g { animation: lockThump 0.55s ease; }
        @keyframes shackleOpen {
            0%   { transform: translateY(0) rotate(0deg); }
            45%  { transform: translateY(-12px) rotate(0deg); }
            100% { transform: translateY(-12px) rotate(28deg); }
        }
        @keyframes lockThump {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.08); }
        }
        @keyframes lockShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-7px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(3px); }
        }

        /* ---------- Rebirth visuals on the simulation pane ---------- */
        .rebirth-hint {
            position: absolute;
            left: 50%;
            bottom: 4.5rem;
            z-index: 3;
            transform: translateX(-50%);
            color: var(--rebirth-text);
            font-weight: 700;
            letter-spacing: 1px;
            padding: 0.55rem 1.3rem;
            border-radius: 9999px;
            background: rgba(21, 1, 26, 0.88);
            border: 1px solid var(--rebirth-border);
            box-shadow: 0 0 0 1px #000, 0 0 24px -6px rgba(191, 64, 191, 0.6);
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
            transition: opacity 0.4s ease;
        }
        .screen.dormant .rebirth-hint {
            opacity: 1;
            animation: hintFloat 2.4s ease-in-out infinite;
        }
        @keyframes hintFloat {
            0%, 100% { transform: translate(-50%, 0); }
            50%      { transform: translate(-50%, -5px); }
        }

        .rebirth-flash {
            position: absolute;
            inset: 0;
            z-index: 7;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(circle at center, rgba(231, 198, 255, 0.85) 0%, rgba(191, 64, 191, 0.55) 30%, rgba(21, 1, 26, 0) 70%);
        }
        .rebirth-flash.go { animation: rebirthFlash 1.3s ease-out; }
        @keyframes rebirthFlash {
            0%   { opacity: 0; transform: scale(0.6); }
            28%  { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0; transform: scale(1.4); }
        }

        /* ================= Mutations pane ================= */
        .upgrades-pane {
            position: relative;
            z-index: 2;
            width: 450px;
            min-height: 0;
            background-color: var(--panel-bg);
            border-left: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 14px rgba(0, 0, 0, 0.18);
            overflow: hidden;
        }
        .upgrades-pane > * { transition: filter 0.45s ease, opacity 0.45s ease; }
        /* Viewing a colony that has not been bought yet: the whole pane greys out */
        .upgrades-pane.greyed > * {
            filter: grayscale(1);
            opacity: 0.45;
            pointer-events: none;
        }

        .pane-title {
            padding: 1.5rem;
            font-size: 1.25rem;
            font-weight: 700;
            border-bottom: 1px solid var(--border);
            letter-spacing: 0.5px;
            text-align: center;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.025), transparent);
            transition: color 0.3s ease, text-shadow 0.3s ease, filter 0.45s ease, opacity 0.45s ease;
        }
        .pane-title.rebirth-mode {
            color: var(--rebirth-text);
            text-shadow: 0 0 14px rgba(191, 64, 191, 0.45);
        }

        .upgrades-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 1rem;
            scrollbar-width: thin;
            scrollbar-color: #475569 transparent;
        }
        .upgrades-list::-webkit-scrollbar { width: 8px; }
        .upgrades-list::-webkit-scrollbar-track { background: transparent; }
        .upgrades-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 9999px; }
        .upgrades-list::-webkit-scrollbar-thumb:hover { background: #475569; }

        .upgrade-group { display: none; }
        .upgrade-group.active { display: block; animation: groupIn 0.35s ease; }
        @keyframes groupIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .upgrade-card {
            background: linear-gradient(180deg, #111b31 0%, #0f172a 100%);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
        }
        .upgrade-card:hover {
            border-color: #475569;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px -12px rgba(0, 0, 0, 0.8);
        }
        .upgrade-card.affordable { border-color: rgba(59, 130, 246, 0.42); }
        .upgrade-card.affordable:hover { border-color: rgba(96, 165, 250, 0.7); }
        .upgrade-card.reveal { animation: cardReveal 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
        .upgrade-card.bought { animation: cardBought 0.42s ease; }
        @keyframes cardReveal {
            0%   { opacity: 0; transform: translateY(14px) scale(0.97); border-color: rgba(96, 165, 250, 0.9); box-shadow: 0 0 0 rgba(59, 130, 246, 0); }
            60%  { opacity: 1; box-shadow: 0 0 26px -4px rgba(59, 130, 246, 0.55); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes cardBought {
            0%   { transform: scale(1); }
            35%  { transform: scale(0.985); box-shadow: 0 0 22px -6px rgba(59, 130, 246, 0.6); }
            100% { transform: scale(1); }
        }

        .upgrade-info {
            flex: 1;
            padding-right: 1rem;
        }

        .upgrade-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.25rem;
            color: var(--text-main);
        }

        .upgrade-desc {
            font-size: 0.825rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .upgrade-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .meta-lvl { color: var(--accent-purple); }
        .meta-effect { color: var(--accent-primary); }
        .meta-lvl.tick { animation: lvlTick 0.35s ease; display: inline-block; }
        @keyframes lvlTick {
            0%   { transform: translateY(0); }
            40%  { transform: translateY(-3px); color: #c4b5fd; }
            100% { transform: translateY(0); }
        }

        .upgrade-btn {
            --p: 0%;
            background: linear-gradient(180deg, #3b82f6 0%, #2f6fe8 100%);
            color: white;
            border: none;
            padding: 0.75rem 1.2rem;
            border-radius: 0.5rem;
            font-weight: 700;
            cursor: pointer;
            min-width: 100px;
            text-align: center;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 2px 10px -3px rgba(37, 99, 235, 0.6);
            transition: background-color 0.2s, opacity 0.2s, transform 0.12s ease, box-shadow 0.2s, filter 0.2s;
        }
        .upgrade-btn:hover:not(:disabled) {
            filter: brightness(1.1);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 4px 14px -3px rgba(37, 99, 235, 0.75);
        }
        .upgrade-btn:active:not(:disabled) { transform: scale(0.95); }
        /* Unaffordable: grey, with a quiet fill showing how close you are */
        .upgrade-btn:disabled {
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.28) 0%, rgba(59, 130, 246, 0.28) var(--p), #334155 var(--p), #334155 100%);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Next mutation teaser */
        .upgrade-card.teaser {
            border-style: dashed;
            background: rgba(15, 23, 42, 0.55);
            justify-content: flex-start;
            gap: 0.9rem;
        }
        .upgrade-card.teaser:hover { transform: none; box-shadow: none; border-color: var(--border); }
        .teaser .upgrade-name { color: var(--text-muted); }
        .teaser .upgrade-desc { margin-bottom: 0; }
        .teaser-icon { width: 34px; height: 38px; color: #475569; flex-shrink: 0; overflow: visible; }
        .teaser-bar {
            height: 5px;
            border-radius: 9999px;
            background: #1e293b;
            overflow: hidden;
            margin-top: 0.55rem;
        }
        .teaser-bar > i {
            display: block;
            height: 100%;
            width: 0;
            border-radius: inherit;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            transition: width 0.35s ease;
        }

        /* Rebirth mutations */
        .upgrade-card.rebirth {
            background: var(--rebirth-bg);
            border: 1px solid var(--rebirth-border);
            box-shadow: 0 0 0 1px #000;
        }
        .upgrade-card.rebirth:hover {
            border-color: #b25ae0;
            box-shadow: 0 0 0 1px #000, 0 8px 22px -10px rgba(153, 50, 204, 0.6);
        }
        .upgrade-card.rebirth.affordable { border-color: #c06ae8; }
        .upgrade-card.rebirth .upgrade-name { color: #f5e8ff; }
        .upgrade-card.rebirth .upgrade-desc { color: #bfa2cf; }
        .upgrade-card.rebirth .meta-lvl { color: var(--rebirth-text); }
        .upgrade-card.rebirth .meta-effect { color: #d58bf0; }
        .upgrade-card.rebirth .upgrade-btn {
            background: var(--rebirth);
            color: var(--rebirth-text);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 2px 10px -2px rgba(191, 64, 191, 0.6);
        }
        .upgrade-card.rebirth .upgrade-btn:hover:not(:disabled) {
            filter: brightness(1.12);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24), 0 4px 16px -2px rgba(191, 64, 191, 0.75);
        }
        .upgrade-card.rebirth .upgrade-btn:disabled {
            background: linear-gradient(90deg, rgba(191, 64, 191, 0.35) 0%, rgba(191, 64, 191, 0.35) var(--p), #2a0b33 var(--p), #2a0b33 100%);
            color: rgba(231, 198, 255, 0.5);
        }
        .upgrade-card.rebirth.owned { border-color: rgba(153, 50, 204, 0.5); }
        .upgrade-card.rebirth.owned .upgrade-btn:disabled {
            background: #2a0b33;
            color: var(--rebirth-text);
        }
        .upgrade-card.rebirth.bought { animation: rebirthBought 0.55s ease; }
        @keyframes rebirthBought {
            0%   { transform: scale(1); }
            35%  { transform: scale(0.985); box-shadow: 0 0 0 1px #000, 0 0 28px -4px rgba(191, 64, 191, 0.8); }
            100% { transform: scale(1); }
        }

        /* Rebirth button pinned at the bottom of the pane */
        .rebirth-bar {
            padding: 0.9rem 1rem 1rem;
            border-top: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(21, 1, 26, 0), rgba(21, 1, 26, 0.4));
        }
        .rebirth-bar.hidden { display: none; }
        .rebirth-btn {
            position: relative;
            overflow: hidden;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.15rem;
            padding: 0.7rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid var(--rebirth-border);
            box-shadow: 0 0 0 1px #000;
            background: var(--rebirth-bg);
            color: var(--rebirth-text);
            cursor: not-allowed;
            font-weight: 700;
            transition: transform 0.15s ease, filter 0.2s ease;
        }
        .rb-fill {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 0;
            background: linear-gradient(90deg, rgba(153, 50, 204, 0.15), rgba(191, 64, 191, 0.38));
            transition: width 0.4s ease, opacity 0.3s ease;
        }
        .rb-title, .rb-sub { position: relative; }
        .rb-title { font-size: 1rem; letter-spacing: 1.5px; text-transform: uppercase; }
        .rb-sub { font-size: 0.8rem; font-weight: 600; opacity: 0.88; font-variant-numeric: tabular-nums; }
        .rebirth-btn.ready {
            cursor: pointer;
            background: linear-gradient(135deg, #BF40BF, #8e2bb0);
            animation: rebirthPulse 2.2s ease-in-out infinite;
        }
        .rebirth-btn.ready .rb-fill { opacity: 0; }
        .rebirth-btn.ready:hover { transform: translateY(-1px); filter: brightness(1.08); }
        .rebirth-btn.ready:active { transform: scale(0.98); }
        .rebirth-btn.confirm { background: linear-gradient(135deg, #d955d9, #9932cc); }
        @keyframes rebirthPulse {
            0%, 100% { box-shadow: 0 0 0 1px #000, 0 0 0 0 rgba(191, 64, 191, 0); }
            50%      { box-shadow: 0 0 0 1px #000, 0 0 22px 2px rgba(191, 64, 191, 0.55); }
        }

        /* ================= Toasts ================= */
        #toast-stack {
            position: fixed;
            left: calc((100vw - 450px) / 2);
            bottom: 1.5rem;
            transform: translateX(-50%);
            z-index: 9000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            pointer-events: none;
        }
        .toast {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #475569;
            color: var(--text-main);
            padding: 0.65rem 1.2rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            box-shadow: 0 10px 28px -10px rgba(0, 0, 0, 0.8);
            animation: toastIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .toast.purple {
            background: var(--rebirth-bg);
            border-color: var(--rebirth-border);
            color: var(--rebirth-text);
            box-shadow: 0 0 0 1px #000, 0 10px 28px -10px rgba(191, 64, 191, 0.6);
        }
        .toast.out { opacity: 0; transform: translateY(8px); }

        /* ================= Reset confirmation ================= */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: rgba(2, 6, 23, 0.6);
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .modal-backdrop[hidden] { display: none; }
        .modal-backdrop.open { opacity: 1; }
        .modal {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(180deg, #212d42 0%, var(--panel-bg) 100%);
            border: 1px solid #475569;
            border-radius: 1rem;
            padding: 1.6rem 1.6rem 1.2rem;
            text-align: center;
            box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transform: translateY(10px) scale(0.96);
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .modal-backdrop.open .modal { transform: translateY(0) scale(1); }
        .modal-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 0.85rem;
            border-radius: 50%;

<script>
// =====================================================================
// AUDIO
// =====================================================================

// ===== Shared audio engine =====
// Every sound effect runs through one context and one master bus. A gentle compressor lifts the quiet
// sounds so they stay audible at low device volume, and keeps peaks from blasting at max volume.
const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

const SOUND_LEVELS = {
  music: 0.1, // ambient pads: quiet, but present
  click: 0.55,  // cell pop (raised so it cuts through the music)
  tink: 0.24    // upgrade purchase (raised so it cuts through the music)
};

// ===== Player volume settings (saved separately from the game, so a game reset keeps them) =====
// 1 = the game's normal level. The sliders go from 0% to 150%.
const VOLUME_KEY = 'cellEvoClicker.volume';
const VOLUME = (function () {
  const v = { music: 1, sfx: 1 };
  try {
    const saved = JSON.parse(localStorage.getItem(VOLUME_KEY) || 'null');
    if (saved) {
      ['music', 'sfx'].forEach(k => {
        if (typeof saved[k] === 'number' && isFinite(saved[k])) v[k] = Math.max(0, Math.min(1.5, saved[k]));
      });
    }
  } catch (e) { }
  return v;
})();
function saveVolume() {
  try { localStorage.setItem(VOLUME_KEY, JSON.stringify(VOLUME)); } catch (e) { }
}
// Music level after the player's volume setting
function musicLevel() { return SOUND_LEVELS.music * VOLUME.music; }

// Final volume knob for clicks and purchases (after the compressor, so it scales them evenly)
const sfxVolume = audioCtx.createGain();
sfxVolume.gain.value = VOLUME.sfx;
sfxVolume.connect(audioCtx.destination);

const masterBus = (function() {
  // Lighter compression than before so louder clicks and purchases actually come through louder
  const comp = audioCtx.createDynamicsCompressor();
  comp.threshold.setValueAtTime(-14, audioCtx.currentTime);
  comp.knee.setValueAtTime(12, audioCtx.currentTime);
  comp.ratio.setValueAtTime(2.5, audioCtx.currentTime);
  comp.attack.setValueAtTime(0.004, audioCtx.currentTime);
  comp.release.setValueAtTime(0.25, audioCtx.currentTime);

  const makeup = audioCtx.createGain();
  makeup.gain.setValueAtTime(1.3, audioCtx.currentTime);

  comp.connect(makeup);
  makeup.connect(sfxVolume);
  return comp;
})();

function resumeAudio() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

// ===== Ambient music =====
// Same slow Cmaj7 -> Am9 -> Fmaj7 -> G6 progression and 6 second pacing as before.
// What changed so it stays calm at high volume:
//  - The chord tones are voiced an octave higher and spread apart, leaving one soft bass note alone
//    in the low register (stacked low sines were what made it rumble and growl).
//  - A warm, slightly rounded tone (a few soft harmonics) with a gentle low-pass instead of bare sines.
//  - A small generated room reverb and two lightly detuned voices per note for width.
//  - Music has its own soft limiter and no longer goes through the click compressor,
//    so clicking can no longer make the pads pump and distort.
(function() {
  let isPlaying = false;
  let timerId = null;
  let mainGain = null;
  let padBus = null;
  let padWave = null;

  const midi = (n) => 440 * Math.pow(2, (n - 69) / 12);

  // bass: one low root, tones: chord voiced around middle C, bells: soft notes floating on top
  const chords = [
    { bass: 48, tones: [55, 64, 71],     bells: [76, 79, 83] }, // Cmaj7: C3 | G3 E4 B4
    { bass: 45, tones: [60, 64, 67, 71], bells: [72, 76, 79] }, // Am9:   A2 | C4 E4 G4 B4
    { bass: 41, tones: [60, 64, 69],     bells: [72, 77, 81] }, // Fmaj7: F2 | C4 E4 A4
    { bass: 43, tones: [59, 62, 64],     bells: [71, 74, 79] }  // G6:    G2 | B3 D4 E4
  ];
  let chordIndex = 0;

  const button = document.getElementById('bgm-toggle-btn');

  // Short stereo noise burst with an exponential tail = a soft, natural sounding room
  function buildImpulse(seconds, decay) {
    const rate = audioCtx.sampleRate;
    const len = Math.floor(rate * seconds);
    const buf = audioCtx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  function initAudio() {
    const t = audioCtx.currentTime;

    // Output stage: a soft limiter that only catches peaks
    const limiter = audioCtx.createDynamicsCompressor();
    limiter.threshold.setValueAtTime(-10, t);
    limiter.knee.setValueAtTime(8, t);
    limiter.ratio.setValueAtTime(6, t);
    limiter.attack.setValueAtTime(0.02, t);
    limiter.release.setValueAtTime(0.5, t);
    limiter.connect(audioCtx.destination);

    // Trim so the softer, filtered pads land at the same loudness as the old music (peaks stay far below clipping)
    const trim = audioCtx.createGain();
    trim.gain.setValueAtTime(2.7, t);
    trim.connect(limiter);

    mainGain = audioCtx.createGain();
    mainGain.gain.setValueAtTime(musicLevel(), t); // Keep it nice and quiet
    mainGain.connect(trim);

    // Tone shaping: everything is low-passed, then split into a dry path and a reverb path
    const tone = audioCtx.createBiquadFilter();
    tone.type = 'lowpass';
    tone.frequency.setValueAtTime(2400, t);
    tone.Q.setValueAtTime(0.4, t);

    const dry = audioCtx.createGain();
    dry.gain.setValueAtTime(0.85, t);
    const wet = audioCtx.createGain();
    wet.gain.setValueAtTime(0.45, t);
    const verb = audioCtx.createConvolver();
    verb.buffer = buildImpulse(3.2, 2.6);

    tone.connect(dry);
    dry.connect(mainGain);
    tone.connect(verb);
    verb.connect(wet);
    wet.connect(mainGain);
    padBus = tone;

    // Warm, round waveform: fundamental plus a few quiet overtones
    padWave = audioCtx.createPeriodicWave(
      new Float32Array([0, 0, 0, 0, 0, 0]),
      new Float32Array([0, 1, 0.3, 0.1, 0.04, 0.015])
    );
  }

  // One pad note. spread = two slightly detuned copies panned left/right for a wide, calm shimmer.
  function playPad(freq, startTime, duration, level, spread) {
    if (!mainGain) return;
    const env = audioCtx.createGain();
    // Gentle attack and long release fade out to avoid clicks
    env.gain.setValueAtTime(0, startTime);
    env.gain.linearRampToValueAtTime(level, startTime + 1.5);
    env.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    env.connect(padBus);

    const detunes = spread ? [-5, 5] : [0];
    detunes.forEach((cents, k) => {
      const osc = audioCtx.createOscillator();
      osc.setPeriodicWave(padWave);
      osc.frequency.setValueAtTime(freq, startTime);
      osc.detune.setValueAtTime(cents, startTime);
      if (spread && audioCtx.createStereoPanner) {
        const pan = audioCtx.createStereoPanner();
        pan.pan.setValueAtTime(k ? 0.35 : -0.35, startTime);
        osc.connect(pan);
        pan.connect(env);
      } else {
        osc.connect(env);
      }
      osc.start(startTime);
      osc.stop(startTime + duration + 0.05);
    });
  }

  // Soft glassy bell: a pure tone plus a quiet octave, quick attack and a long fade
  function playBell(freq, startTime, level) {
    if (!mainGain) return;
    const env = audioCtx.createGain();
    env.gain.setValueAtTime(0, startTime);
    env.gain.linearRampToValueAtTime(level, startTime + 0.02);
    env.gain.exponentialRampToValueAtTime(0.001, startTime + 2.8);
    env.connect(padBus);
    [1, 2].forEach((mul, k) => {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq * mul, startTime);
      g.gain.setValueAtTime(k ? 0.25 : 1, startTime);
      osc.connect(g);
      g.connect(env);
      osc.start(startTime);
      osc.stop(startTime + 2.9);
    });
  }

  function scheduler() {
    if (!isPlaying) return;

    const now = audioCtx.currentTime + 0.05;
    const chord = chords[chordIndex];

    // Bass first, then the chord tones slightly staggered for a harp-like feel (notes last 7 seconds)
    playPad(midi(chord.bass), now, 7.0, 0.3, false);
    chord.tones.forEach((n, idx) => {
      playPad(midi(n), now + (idx + 1) * 0.4, 7.0, 0.13, true);
    });

    // Two quiet bell notes drifting over the pad
    const b = chord.bells;
    playBell(midi(b[chordIndex % b.length]), now + 2.2, 0.07);
    playBell(midi(b[(chordIndex + 2) % b.length]), now + 3.8, 0.055);

    chordIndex = (chordIndex + 1) % chords.length;

    // Schedule next chord change in 6 seconds (creates a lush, overlapping texture)
    timerId = setTimeout(scheduler, 6000);
  }

  // Sound effects briefly dip the music (like a radio DJ talking over a song) so clicks and purchases stand out
  window.duckMusic = function () {
    if (!isPlaying || !mainGain) return;
    const t = audioCtx.currentTime;
    const g = mainGain.gain;
    g.cancelScheduledValues(t);
    g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(musicLevel() * 0.6, t + 0.02);
    g.setTargetAtTime(musicLevel(), t + 0.08, 0.15);
  };

  // ----- Remember whether music was on, across refreshes and visits -----
  const MUSIC_KEY = 'cellEvoClicker.music';
  function rememberMusic(on) {
    try { localStorage.setItem(MUSIC_KEY, on ? 'on' : 'off'); } catch (e) { }
  }
  function musicWasOn() {
    try { return localStorage.getItem(MUSIC_KEY) === 'on'; } catch (e) { return false; }
  }

  function showButton(on) {
    button.textContent = on ? "🎵 Music: On" : "🎵 Music: Off";
    button.classList.toggle('playing', on);
  }

  // Starts the chord loop. Only runs once the audio engine is actually running, otherwise notes
  // scheduled while the browser holds audio paused would all pile up and play at once.
  let loopRunning = false;
  function startLoop() {
    if (!isPlaying || loopRunning || audioCtx.state !== 'running') return;
    loopRunning = true;
    const t = audioCtx.currentTime;
    // Always come back at the same level
    mainGain.gain.cancelScheduledValues(t);
    mainGain.gain.setValueAtTime(musicLevel(), t);
    clearTimeout(timerId);
    scheduler();
  }

  function startMusic() {
    if (!mainGain) initAudio();
    isPlaying = true;
    showButton(true);
    rememberMusic(true);
    resumeAudio();
    if (audioCtx.state === 'running') startLoop();
    else audioCtx.resume().then(startLoop).catch(() => {});
  }

  function stopMusic() {
    isPlaying = false;
    loopRunning = false;
    showButton(false);
    rememberMusic(false);
    clearTimeout(timerId);
    if (!mainGain) return;
    const t = audioCtx.currentTime;
    // Fade out current playing trails gracefully
    mainGain.gain.cancelScheduledValues(t);
    mainGain.gain.setValueAtTime(mainGain.gain.value, t);
    mainGain.gain.linearRampToValueAtTime(0, t + 1);
  }

  // Volume slider moved: glide the music to the new level (only while it is playing)
  window.applyMusicVolume = function () {
    if (!mainGain || !isPlaying) return;
    const t = audioCtx.currentTime;
    mainGain.gain.cancelScheduledValues(t);
    mainGain.gain.setValueAtTime(mainGain.gain.value, t);
    mainGain.gain.setTargetAtTime(musicLevel(), t, 0.05);
  };

  button.addEventListener('click', () => {
    // Mobile browsers require a user resume command
    if (!isPlaying) startMusic();
    else stopMusic();
  });

  // Music was on last time: show it as on right away. Browsers only allow sound after the player
  // interacts with the page, so it begins on the first click or key press anywhere.
  if (musicWasOn()) {
    initAudio();
    isPlaying = true;
    showButton(true);

    const kick = (e) => {
      if (e.target === button) return; // the button's own click decides on/off by itself
      document.removeEventListener('pointerdown', kick, true);
      document.removeEventListener('keydown', kick, true);
      if (isPlaying) audioCtx.resume().then(startLoop).catch(() => {});
    };
    document.addEventListener('pointerdown', kick, true);
    document.addEventListener('keydown', kick, true);
  }
})();

// ===== Volume button + panel =====
(function volumeControls() {
  const btn = document.getElementById('volume-btn');
  const panel = document.getElementById('volume-panel');
  const wrap = document.getElementById('volume-wrap');
  const sliders = { music: document.getElementById('vol-music'), sfx: document.getElementById('vol-sfx') };
  const values = { music: document.getElementById('vol-music-val'), sfx: document.getElementById('vol-sfx-val') };

  // Shows a setting on its slider: position, % label and the coloured fill
  function paint(k) {
    const pct = Math.round(VOLUME[k] * 100);
    sliders[k].value = pct;
    values[k].textContent = pct + '%';
    sliders[k].style.setProperty('--fill', (pct / 150 * 100).toFixed(1) + '%');
  }
  // Speaker icon: crossed out when everything is silent, one wave when quiet
  function updateIcon() {
    const level = Math.max(VOLUME.music, VOLUME.sfx);
    btn.classList.toggle('muted', level === 0);
    btn.classList.toggle('low', level > 0 && level < 0.5);
  }

  ['music', 'sfx'].forEach(k => {
    paint(k);
    sliders[k].addEventListener('input', () => {
      VOLUME[k] = Number(sliders[k].value) / 100;
      paint(k);
      updateIcon();
      if (k === 'music') {
        if (window.applyMusicVolume) window.applyMusicVolume();
      } else {
        sfxVolume.gain.setTargetAtTime(VOLUME.sfx, audioCtx.currentTime, 0.02);
      }
      saveVolume();
    });
  });
  // Let the player hear the new effects level when they let go of the slider
  sliders.sfx.addEventListener('change', () => playSoftClick());
  updateIcon();

  function setOpen(open) {
    panel.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  btn.addEventListener('click', () => setOpen(!panel.classList.contains('open')));
  // Click anywhere else (or press Esc) to close it
  document.addEventListener('pointerdown', (e) => { if (!wrap.contains(e.target)) setOpen(false); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setOpen(false); });
})();

function playSoftClick() {
  // Resume context if browser paused it (standard security feature)
  resumeAudio();

  // Create nodes for a soft, low-pass filtered click
  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();

  // Connection chain: Oscillator -> Filter -> Gain -> Master bus
  osc.connect(filter);
  filter.connect(gainNode);
  gainNode.connect(masterBus);

  // Sound characteristics: A soft "thump/pop" suitable for cells
  osc.type = 'sine';
  osc.frequency.setValueAtTime(120, audioCtx.currentTime); // Low baseline pitch
  osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.08); // Quick slide down

  // Soft low-pass filter to remove harsh clicking artifacts
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(800, audioCtx.currentTime);

  // Volume envelope (Prevents speaker popping, keeps it soft but audible)
  gainNode.gain.setValueAtTime(SOUND_LEVELS.click, audioCtx.currentTime);
  gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08); // Fast decay

  // Start and stop instantly
  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + 0.08);

  // A quiet higher "pop" layered on top of the same thump, so it is audible on laptop speakers and over the bass of the music
  const pop = audioCtx.createOscillator();
  const popGain = audioCtx.createGain();
  pop.type = 'sine';
  pop.frequency.setValueAtTime(360, audioCtx.currentTime);
  pop.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.06);
  popGain.gain.setValueAtTime(SOUND_LEVELS.click * 0.4, audioCtx.currentTime);
  popGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
  pop.connect(popGain);
  popGain.connect(masterBus);
  pop.start(audioCtx.currentTime);
  pop.stop(audioCtx.currentTime + 0.06);

  if (window.duckMusic) window.duckMusic();
}

function playSoftTink() {
  try {
    // 1. Use the shared audio context (handles browser auto-play restrictions on click)
    resumeAudio();
    const ctx = audioCtx;

    // 2. Create the nodes: Oscillator (synth tone) and Gain (volume controller)
    const osc = ctx.createOscillator();
    const gainNode = ctx.createGain();

    osc.connect(gainNode);
    gainNode.connect(masterBus);

    // 3. Make it soft, smooth, and non-piercing by using a pure Sine wave
    osc.type = 'sine';

    const now = ctx.currentTime;

    // 4. Create the downward "tink" sweep (starts at mid-range, drops rapidly)
    // Starting frequency (mid-high but not piercing)
    osc.frequency.setValueAtTime(600, now);
    // Sweeps downward to a deep soft thump in 0.15 seconds
    osc.frequency.exponentialRampToValueAtTime(150, now + 0.15);

    // 5. Volume Envelope (Quietish peak volume with an instant fade out)
    gainNode.gain.setValueAtTime(0, now);
    // Soft attack: reaches peak volume quickly but smoothly
    gainNode.gain.linearRampToValueAtTime(SOUND_LEVELS.tink, now + 0.01);
    // Smooth decay: fades out completely
    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

    // 6. Play and self-destruct the nodes when finished to save memory
    osc.start(now);
    osc.stop(now + 0.15);

    if (window.duckMusic) window.duckMusic();
  } catch (e) {
    console.log("Audio not supported or blocked:", e);
  }
}

// Each stage's artwork is parsed once into a template, then cloned per cell (much cheaper than re-parsing HTML)
const stageTemplates = [];
function stageTpl(idx) {
    if (!stageTemplates[idx]) {
        const st = STAGES[idx];
        const make = (html) => { const t = document.createElement('template'); t.innerHTML = html; return t.content; };
        const orgHtml = st.organelles ? st.organelles(st, idx) : '';
        stageTemplates[idx] = {
            features: make(st.features ? st.features(st, idx) : ''),
            organelles: make(orgHtml),
            liveOrganelles: /<animate|stem-sheen|chimera-sheen|galaxy-sheen/.test(orgHtml),
            nucleus: make(st.nucleus && st.nucleus.inner ? st.nucleus.inner : '')
        };
    }
    return stageTemplates[idx];
}

function stageForLevels(total) {

// CELL MASS LAYOUT
// =====================================================================
const SPACING = 198; // centre-to-centre distance between neighbouring cells

// Hexagonal slots filled ring by ring (1 + 6 + 12 + 18 = 37 cells = 36 Mitotic Divisions)
const HEX_SLOTS = (function () {
    const dirs = [[-1, 1], [-1, 0], [0, -1], [1, -1], [1, 0], [0, 1]];
    const out = [{ q: 0, r: 0, ring: 0 }];
    for (let k = 1; k <= 3; k++) {
        let q = k, r = 0;
        for (let i = 0; i < 6; i++) {
            for (let j = 0; j < k; j++) {
                out.push({ q, r, ring: k });
                q += dirs[i][0];
                r += dirs[i][1];
            }
        }
    }
    return out.map(h => ({ x: SPACING * (h.q + h.r / 2), y: SPACING * (Math.sqrt(3) / 2) * h.r, ring: h.ring }));
})();
