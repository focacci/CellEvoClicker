// =====================================================================
class Colony {
    constructor(index) {
        this.index = index;
        this.def = COLONY_DEFS[index];
        this.unlocked = index === 0;
        this.unlocking = false;
        this.levels = {};
        UPGRADES.forEach(u => { this.levels[u.key] = 0; });
        this.cells = [];
        this.currentStage = -1;
        this.massScale = 1;
        this.junctionTimer = null;
        this.cooldownTimer = null;
        this.lastClickTime = -Infinity;
        this.lastAutoTime = performance.now();
        this.version = 0;
        this.cards = {};
        this.cardList = [];
        this.recalc();
        this.buildScreen();
        this.buildGroup();
    }

    // ---------- Screen DOM ----------
    buildScreen() {
        const screen = el('section', 'screen');
        const content = el('div', 'screen-content');
        const badge = el('div', 'stage-badge');
        const area = el('div', 'cell-container');
        if (this.index === 0) area.id = 'cell-click-area';
        const mass = el('div', 'cell-mass');
        this.featureLayer = el('div', 'mass-layer layer-features');
        this.bodyLayer = el('div', 'mass-layer layer-bodies');
        this.junctionLayer = el('div', 'mass-layer layer-junctions');
        this.fxLayer = el('div', 'mass-layer layer-fx');
        mass.append(this.featureLayer, this.bodyLayer, this.junctionLayer, this.fxLayer);
        area.appendChild(mass);

        // Stage bubble: name, a dropdown chevron and the yellow progress bar toward the next stage
        badge.setAttribute('role', 'button');
        badge.setAttribute('tabindex', '0');
        badge.setAttribute('aria-haspopup', 'true');
        badge.setAttribute('aria-expanded', 'false');
        badge.innerHTML = '<span class="badge-label"></span>' +
            '<svg class="badge-chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 L6 7.5 L9 4.5"/></svg>' +
            '<span class="stage-xp" aria-hidden="true"><i></i></span>';
        this.badgeLabel = badge.querySelector('.badge-label');
        this.xpFill = badge.querySelector('.stage-xp > i');
        badge.addEventListener('pointerdown', (e) => e.stopPropagation());
        badge.addEventListener('click', (e) => { e.stopPropagation(); this.toggleStageMenu(); });
        badge.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.toggleStageMenu(); }
        });

        // Dropdown listing every stage (built on first open)
        const menu = el('div', 'stage-menu');
        menu.setAttribute('role', 'list');
        menu.addEventListener('pointerdown', (e) => e.stopPropagation());
        this.stageMenu = menu;
        this.stageItems = null;
        // Lives on the simulation pane itself (not inside the sliding screen) so it sits above the floating DNA yields
        simPane.appendChild(menu);

        content.append(badge, area);
        screen.appendChild(content);

        if (this.index > 0) {
            const overlay = el('div', 'lock-overlay');
            overlay.innerHTML = `<button class="lock-btn" type="button" aria-label="Unlock ${this.def.name}">${LOCK_SVG}` +
                `<span class="lock-price">${DNA_ICON}${fmtLongTrim(this.def.unlockCost)}</span>` +
                `<span class="lock-caption">Unlock ${this.def.name}</span></button>`;
            this.overlay = overlay;
            this.lockBtn = overlay.querySelector('.lock-btn');
            this.lockBtn.addEventListener('click', () => this.tryUnlock());
            this.lockBtn.addEventListener('animationend', (e) => { if (e.animationName === 'lockShake') this.lockBtn.classList.remove('denied'); });
            screen.appendChild(overlay);
            screen.classList.add('locked');
        } else {
            const hint = el('div', 'rebirth-hint');
            hint.textContent = 'Click the cell to begin a new cycle';
            screen.appendChild(hint);
        }

        area.addEventListener('click', (e) => this.handleClick(e));

        this.screen = screen;
        this.content = content;
        this.badge = badge;
        this.area = area;
        this.massEl = mass;
        screenTrack.appendChild(screen);
    }

    // ---------- Stats ----------
    recalc() {
        const L = this.levels;
        this.stats = {
            clickPower: clickPowerAt(L.clickPower),
            autoPower: autoPowerAt(L.autoClickPower),
            clickCooldown: Math.max(50, 300 - L.clickCooldown * 25),     // ms
            autoCooldown: Math.max(100, 1000 - L.autoClickCooldown * 75), // ms
            critChance: L.critChance * 0.5,       // % (manual clicks), 0% -> 10% over 20 levels
            autoCritChance: L.autoCritChance * 0.5 // % (automatic clicks), 0% -> 10% over 20 levels
        };
    }
    totalLevels() {
        let t = 0;
        for (const k in this.levels) t += this.levels[k];
        return t;
    }
    cellCount() { return 1 + this.levels.extraCells; }
    critMult() { return (10 + this.levels.critPower * 5) * (has('lucky') ? 2 : 1); }
    stageMult() { return has('leap') ? LEAP_MULT[stageForLevels(this.totalLevels())] : 1; }

    // Yield generated by ONE cell (the base amount shown above each cell)
    manualPerCell() {
        const s = this.stats;
        const absorbed = s.autoPower * this.levels.endocyticUptake * 0.10;
        return (s.clickPower + absorbed) * (1 + this.levels.ribosomalSynthesis * 0.25) *
            this.def.yieldScale * globalMult() * (has('membrane') ? 3 : 1) * this.stageMult();
    }
    passivePerCell() {
        return this.stats.autoPower * (1 + this.levels.chloroplastSymbiosis * 0.25) *
            this.def.yieldScale * globalMult() * (has('metabolism') ? 3 : 1) * this.stageMult();
    }
    passivePerSecond() {
        if (!this.unlocked || game.pending || this.stats.autoPower <= 0) return 0;
        return this.passivePerCell() * this.cellCount() * (1000 / this.stats.autoCooldown);
    }

    // ---------- Mutation rules ----------
    reqLevel(n) { return has('memory') ? Math.ceil(n / 2) : n; }
    isRevealed(up) {
        if (!this.unlocked) return up.key === 'clickPower';
        if (!up.req || this.levels[up.key] > 0) return true;
        return this.levels[up.req[0]] >= this.reqLevel(up.req[1]);
    }
    isMaxed(key) {
        const up = UP[key];
        return up.max !== null && this.levels[key] >= up.max;
    }
    cost(key) {
        const up = UP[key];
        let c = up.baseCost * Math.pow(up.mult, this.levels[key]) * this.def.costScale * (1 - this.levels.telomerase * 0.03);
        if (has('telo1')) c *= 0.85;
        if (has('telo2')) c *= 0.75;
        if (key === 'extraCells' && has('hyperplasia')) c *= 0.5;
        return Math.floor(c);
    }
    effectString(key) {
        const L = this.levels, s = this.stats, y = this.def.yieldScale;
        switch (key) {
            case 'clickPower': return `+${DNA_ICON}${fmtShort(s.clickPower * y)} / click`;
            case 'clickCooldown': return `${s.clickCooldown}ms latency`;
            case 'autoClickPower': return `+${DNA_ICON}${fmtShort(s.autoPower * y)} power`;
            case 'autoClickCooldown': return `${(s.autoCooldown / 1000).toFixed(2)}s pace`;
            case 'ribosomalSynthesis': return `+${L[key] * 25}% manual`;
            case 'chloroplastSymbiosis': return `+${L[key] * 25}% passive`;
            case 'critChance': return `${fmt(s.critChance)}% chance`;
            case 'autoCritChance': return `${fmt(s.autoCritChance)}% chance`;
            case 'critPower': return `x${this.critMult()} crit yield`;
            case 'endocyticUptake': return `${L[key] * 10}% absorbed`;
            case 'extraCells': { const n = this.cellCount(); return `${n} ${n === 1 ? 'cell' : 'cells'}`; }
            case 'telomerase': return L[key] ? `-${L[key] * 3}% cost` : '0% cost';
            default: return '';
        }
    }

    // ---------- Mutation cards ----------
    buildGroup() {
        this.group = el('div', 'upgrade-group');
        this.teaser = el('div', 'upgrade-card teaser');
        this.teaser.innerHTML = TEASER_LOCK +
            '<div class="upgrade-info"><div class="upgrade-name">Unknown Mutation</div>' +
            '<div class="upgrade-desc"></div><div class="teaser-bar"><i></i></div></div>';
        this.teaserDesc = this.teaser.querySelector('.upgrade-desc');
        this.teaserFill = this.teaser.querySelector('.teaser-bar > i');
        this.group.appendChild(this.teaser);
        upgradesContainer.appendChild(this.group);
        this.syncCards(false);
    }

    rebuildGroup() {
        this.cardList.forEach(r => r.card.remove());
        this.cards = {};
        this.cardList = [];
        this.syncCards(false);
    }

    createCard(up, animate) {
        const card = el('div', 'upgrade-card');
        card.innerHTML =
            `<div class="upgrade-info">` +
                `<div class="upgrade-name">${up.label}</div>` +
                `<div class="upgrade-desc">${up.desc}</div>` +
                `<div class="upgrade-meta"><span class="meta-lvl"></span><span class="meta-effect"></span></div>` +
            `</div>` +
            `<button class="upgrade-btn" type="button"></button>`;
        const ref = {
            key: up.key, card,
            btn: card.querySelector('.upgrade-btn'),
            lvl: card.querySelector('.meta-lvl'),
            eff: card.querySelector('.meta-effect'),
            cost: 0, ver: -1, afford: null, maxed: null, p: -1
        };
        ref.btn.addEventListener('click', () => handleUpgradeClick(this, up.key));
        card.addEventListener('animationend', (e) => { if (e.target === card) card.classList.remove('reveal', 'bought'); });
        ref.lvl.addEventListener('animationend', () => ref.lvl.classList.remove('tick'));
        if (animate) card.classList.add('reveal');

        // Keep cards in unlock order, always above the teaser
        const order = UPGRADES.indexOf(up);
        const after = this.cardList.find(r => UPGRADES.indexOf(UP[r.key]) > order);
        this.group.insertBefore(card, after ? after.card : this.teaser);
        this.cards[up.key] = ref;
        this.cardList.push(ref);
        this.cardList.sort((a, b) => UPGRADES.indexOf(UP[a.key]) - UPGRADES.indexOf(UP[b.key]));
    }

    syncCards(animate) {
        UPGRADES.forEach(up => {
            if (!this.cards[up.key] && this.isRevealed(up)) this.createCard(up, animate);
        });
        this.refreshCards();
        this.updateTeaser();
    }

    refreshCards() {
        this.cardList.forEach(r => {
            setText(r.lvl, `Lvl ${this.levels[r.key]}`);
            setHTML(r.eff, this.effectString(r.key));
        });
    }

    updateTeaser() {
        const next = UPGRADES.find(u => !this.cards[u.key]);
        if (!this.unlocked || !next) {
            this.teaser.style.display = 'none';
            return;
        }
        this.teaser.style.display = '';
        const need = this.reqLevel(next.req[1]);
        const have = Math.min(need, this.levels[next.req[0]]);
        setText(this.teaserDesc, `Reach Lvl ${need} ${UP[next.req[0]].label} to unlock (${have}/${need})`);
        this.teaserFill.style.width = (have / need * 100) + '%';
    }

    // Called every frame for the visible colony: affordability + progress fill, without rebuilding anything
    updateButtons() {
        const ver = this.version + costEpoch * 1e6;
        const live = this.unlocked && !game.pending;
        for (let i = 0; i < this.cardList.length; i++) {
            const r = this.cardList[i];
            if (this.isMaxed(r.key)) {
                if (r.maxed !== true) {
                    r.maxed = true;
                    r.afford = null;
                    setHTML(r.btn, 'MAXED');
                    r.btn.disabled = true;
                    r.btn.style.setProperty('--p', '0%');
                    r.card.classList.remove('affordable');
                }
                continue;
            }
            if (r.maxed !== false) { r.maxed = false; r.ver = -1; }
            if (r.ver !== ver) {
                r.ver = ver;
                r.cost = this.cost(r.key);
                setHTML(r.btn, `${DNA_ICON}${fmtShort(r.cost)}`);
            }
            const afford = live && game.money >= r.cost;
            if (afford !== r.afford) {
                r.afford = afford;
                r.btn.disabled = !afford;
                r.card.classList.toggle('affordable', afford);
            }
            if (!afford) {
                const p = live ? Math.floor(Math.min(1, game.money / r.cost) * 50) * 2 : 0;
                if (p !== r.p) { r.p = p; r.btn.style.setProperty('--p', p + '%'); }
            }
        }
    }

    buy(key) {
        if (!this.unlocked || game.pending || this.isMaxed(key)) return;
        const cost = this.cost(key);
        if (game.money < cost) return;
        game.money -= cost;
        displayMoney = Math.min(displayMoney, game.money);
        this.levels[key]++;
        this.recalc();
        this.version++;

        // Apply mechanical changes per level
        if (key === 'extraCells') this.addCell();

        const ref = this.cards[key];
        if (ref) {
            restartAnim(ref.card, 'bought');
            restartAnim(ref.lvl, 'tick');
        }
        this.syncCards(true);
        this.updateEvolution(true);
        statsDirty = true;
        requestSave();
    }

    updateEvolution(animate) {
        this.updateStageProgress();
        const idx = stageForLevels(this.totalLevels());
        if (idx !== this.currentStage) this.evolveTo(idx, animate && this.currentStage !== -1);
    }

    // ---------- Cells ----------
    createCell(index) {
        const feat = el('div', 'cell-feat');
        const rot = el('div', 'feat-rot');
        feat.appendChild(rot);

        const body = el('div', 'cell-body');
        const glow = el('div', 'cell-glow');
        const sphere = el('div', 'cell-sphere');
        const org = el('div', 'organelles');
        const nucleus = el('div', 'nucleus');
        if (index === 0 && this.index === 0) { sphere.id = 'main-cell'; nucleus.id = 'cell-nucleus'; }

        sphere.append(org, nucleus);
        glow.appendChild(sphere);
        body.appendChild(glow);

        feat.style.left = body.style.left = '-100px';
        feat.style.top = body.style.top = '-100px';

        const cell = { index, feat, rot, body, glow, sphere, org, nucleus, x: 0, y: 0, ring: 0, angle: 0, spring: null };
        this.featureLayer.appendChild(feat);
        this.bodyLayer.appendChild(body);
        this.cells.push(cell);
        return cell;
    }

    applyStage(cell, idx) {
        const st = STAGES[idx];
        const tpl = stageTpl(idx);
        const s = cell.sphere;
        s.style.width = st.w + 'px';
        s.style.height = st.h + 'px';
        s.style.borderRadius = st.radius;
        s.style.background = `radial-gradient(circle at 30% 30%, ${st.grad[0]}, ${st.grad[1]}, ${st.grad[2]})`;
        // A shape-shifting outline would re-blur its glow every frame, so that glow is drawn once behind it instead
        const morphing = st.sphereAnim === 'amoeba';
        s.style.boxShadow = (st.hex || morphing)
            ? 'inset -10px -10px 30px rgba(0,0,0,0.7), inset 15px 15px 30px rgba(255,255,255,0.2)'
            : `0 0 50px rgba(${st.glow}, 0.4), inset -10px -10px 30px rgba(0,0,0,0.7), inset 15px 15px 30px rgba(255,255,255,0.2)`;
        s.style.clipPath = st.hex ? HEX_CLIP : '';
        s.classList.toggle('amoeba', morphing);

        cell.glow.classList.toggle('halo-glow', morphing);
        cell.glow.style.setProperty('--halo', `rgba(${st.glow}, 0.4)`);
        cell.glow.style.filter = st.hex ? `drop-shadow(0 0 22px rgba(${st.glow}, 0.45))` : '';

        const n = cell.nucleus;
        if (st.nucleus) {
            n.style.opacity = '1';
            n.style.width = st.nucleus.w + 'px';
            n.style.height = st.nucleus.h + 'px';
            n.style.top = st.nucleus.top;
            n.style.left = st.nucleus.left;
            n.style.background = st.nucleus.bg || NUC_RED;
            n.style.borderRadius = st.nucleus.radius || '50%';
            n.replaceChildren(tpl.nucleus.cloneNode(true));
        } else {
            n.style.opacity = '0';
        }

        cell.org.replaceChildren(tpl.organelles.cloneNode(true));
        cell.org.classList.toggle('live', tpl.liveOrganelles);
        cell.rot.replaceChildren(tpl.features.cloneNode(true));
        if (this.screen.classList.contains('offscreen')) this.pauseSvgs(cell.body, cell.feat);
    }

    featureAngle(cell, st) {
        if (st.orient === 'fixed') return 0;
        if (st.orient === 'outward' && Math.hypot(cell.x, cell.y) > 1) {
            return Math.atan2(cell.y, cell.x) * 180 / Math.PI;
        }
        return (cell.index * 137.508) % 360;
    }

    // Positions every cell so the centre of the mass sits in the centre, and scales the mass to fit
    layoutMass() {
        const n = this.cells.length;
        const slots = HEX_SLOTS.slice(0, n);
        const cx = slots.reduce((a, p) => a + p.x, 0) / n;
        const cy = slots.reduce((a, p) => a + p.y, 0) / n;
        const st = STAGES[Math.max(0, this.currentStage)];

        let maxX = 0, maxY = 0;
        this.cells.forEach((c, i) => {
            c.x = slots[i].x - cx;
            c.y = slots[i].y - cy;
            c.ring = slots[i].ring;
            maxX = Math.max(maxX, Math.abs(c.x));
            maxY = Math.max(maxY, Math.abs(c.y));
        });

        const hw = maxX + st.w / 2;
        const hh = maxY + st.h / 2;
        const availW = Math.max(200, paneW - 64 - 140); // leave room for the side arrows
        const availH = Math.max(200, paneH - 200);
        this.massScale = Math.max(0.2, Math.min(1, availW / (2 * (hw + st.reach)), availH / (2 * (hh + st.reach))));

        this.massEl.style.transform = `scale(${this.massScale})`;
        this.area.style.width = (2 * hw * this.massScale + 100) + 'px';
        this.area.style.height = (2 * hh * this.massScale + 100) + 'px';

        this.cells.forEach(c => {
            const left = (c.x - 100) + 'px', top = (c.y - 100) + 'px';
            c.feat.style.left = left; c.feat.style.top = top;
            c.body.style.left = left; c.body.style.top = top;
            c.angle = this.featureAngle(c, st);
            c.rot.style.transform = `rotate(${c.angle}deg)`;
        });
    }

    rebuildJunctions() {
        this.junctionLayer.innerHTML = '';
        const st = STAGES[this.currentStage];
        if (!st.junction) return;
        const frag = document.createDocumentFragment();
        for (let i = 0; i < this.cells.length; i++) {
            for (let j = i + 1; j < this.cells.length; j++) {
                const a = this.cells[i], b = this.cells[j];
                if (Math.hypot(a.x - b.x, a.y - b.y) > SPACING * 1.05) continue;
                const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
                const jn = el('div', 'junction ' + st.junction);
                jn.style.left = ((a.x + b.x) / 2) + 'px';
                jn.style.top = ((a.y + b.y) / 2) + 'px';
                jn.style.transform = `rotate(${st.junction === 'adhesion' ? ang + 90 : ang}deg)`;
                jn.style.animationDelay = `-${(Math.random() * 2).toFixed(2)}s`;
                frag.appendChild(jn);
            }
        }
        this.junctionLayer.appendChild(frag);
    }

    scheduleJunctions(ms) {
        clearTimeout(this.junctionTimer);
        this.junctionLayer.innerHTML = '';
        this.junctionTimer = setTimeout(() => this.rebuildJunctions(), ms);
    }

    spawnRing(cell, st, scale) {
        const size = Math.max(st.w, st.h) * (scale || 1);
        const ring = el('div', 'evolve-ring');
        ring.style.width = size + 'px';
        ring.style.height = size + 'px';
        ring.style.left = (cell.x - size / 2) + 'px';
        ring.style.top = (cell.y - size / 2) + 'px';
        ring.style.color = st.grad[1];
        this.fxLayer.appendChild(ring);
        setTimeout(() => ring.remove(), 950);
    }

    // Phase change: every cell squeezes, flashes and re-forms as the new stage, rippling out from the centre
    // Where the stage button sits on this colony's screen (layout box, so pop/slide transforms don't skew it).
    // The floating DNA layer skips this area so the button stays solid and readable.
    badgeBox() {
        if (!this._badgeBox) {
            const b = this.badge;
            this._badgeBox = { x: b.offsetLeft, y: b.offsetTop, w: b.offsetWidth, h: b.offsetHeight };
        }
        return this._badgeBox;
    }

    // Yellow bar: share of the way from this stage's level requirement to the next one
    updateStageProgress() {
        const total = this.totalLevels();
        const idx = stageForLevels(total);
        const st = STAGES[idx];
        // Stages with a finalLabel keep a full bar (the Immortal Cell still looks like the end; the Transcendent Cell truly is)
        const capped = !!st.finalLabel || idx >= STAGES.length - 1;
        let p = 1;
        if (!capped) {
            const from = st.min, to = STAGES[idx + 1].min;
            p = Math.max(0, Math.min(1, (total - from) / (to - from)));
        }
        const w = (p * 100).toFixed(1) + '%';
        if (this.xpFill._w !== w) { this.xpFill._w = w; this.xpFill.style.width = w; }
        this.xpFill.parentNode.classList.toggle('galaxy', !!st.galaxy);
        this.badge.title = capped
            ? (st.finalLabel || 'Final stage reached')
            : `${total} / ${STAGES[idx + 1].min} total mutation levels to reach ${STAGES[idx + 1].name}`;
        if (this.stageMenu.classList.contains('open')) this.renderStageMenu();
    }

    toggleStageMenu(force) {
        const open = force !== undefined ? force : !this.stageMenu.classList.contains('open');
        closeStageMenus();
        if (!open) return;
        this.renderStageMenu();
        this.stageMenu.classList.add('open');
        this.badge.classList.add('open');
        this.badge.setAttribute('aria-expanded', 'true');
        const cur = this.stageItems[stageForLevels(this.totalLevels())].entry;
        this.stageMenu.scrollTop = Math.max(0, cur.offsetTop - this.stageMenu.clientHeight / 2 + cur.offsetHeight / 2);
    }

    // Reached stages open a short explainer under their row; clicking the row again closes it
    toggleStageInfo(i) {
        const it = this.stageItems[i];
        if (it.state === 'future') return;
        const open = !it.entry.classList.contains('expanded');
        it.entry.classList.toggle('expanded', open);
        it.row.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (open) setTimeout(() => it.entry.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 260);
    }
    closeStageMenu() {
        this.stageMenu.classList.remove('open');
        this.badge.classList.remove('open');
        this.badge.setAttribute('aria-expanded', 'false');
    }

    // Completed stages green, current white, future grey with the name hidden as "???"
    renderStageMenu() {
        if (!this.stageItems) {
            this.stageItems = STAGES.map((st, i) => {
                const info = STAGE_INFO[i];
                const entry = el('div', 'stage-entry' + (st.galaxy ? ' galaxy' : ''));
                entry.style.setProperty('--stage-color', st.grad[1]);
                const row = el('div', 'stage-item');
                row.innerHTML =
                    `<span class="si-num">${i + 1}</span>` +
                    `<span class="si-dot" style="background:radial-gradient(circle at 30% 30%, ${st.grad[0]}, ${st.grad[1]})"></span>` +
                    `<span class="si-name"></span>` +
                    `<span class="si-req">${st.min ? withCommas(st.min) + ' lvls' : 'Start'}</span>` +
                    `<svg class="si-chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 L6 7.5 L9 4.5"/></svg>`;
                const panel = el('div', 'stage-info');
                panel.innerHTML =
                    `<div class="stage-info-inner"><p${info.glitch ? ` class="glitch" data-text="${info.about}"` : ''}>${info.about}</p>` +
                    (info.fact ? `<p class="si-fact"><strong>Did you know?</strong> ${info.fact}</p>` : '') + `</div>`;
                entry.append(row, panel);
                this.stageMenu.appendChild(entry);
                const it = { entry, row, name: row.querySelector('.si-name'), state: null };
                row.addEventListener('click', () => this.toggleStageInfo(i));
                row.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.toggleStageInfo(i); }
                });
                return it;
            });
        }
        const idx = stageForLevels(this.totalLevels());
        this.stageItems.forEach((it, i) => {
            const state = i < idx ? 'done' : (i === idx ? 'current' : 'future');
            if (it.state === state) return;
            it.state = state;
            it.row.className = 'stage-item ' + state;
            const known = state !== 'future';
            it.name.textContent = known ? STAGES[i].name : '???';
            // Secret stages (the Transcendent Cell) stay out of the list entirely until they are reached
            it.entry.style.display = (!known && STAGES[i].hiddenUntilReached) ? 'none' : '';
            if (known) {
                it.row.setAttribute('role', 'button');
                it.row.setAttribute('tabindex', '0');
                it.row.setAttribute('aria-expanded', it.entry.classList.contains('expanded') ? 'true' : 'false');
                it.row.title = 'Click to learn about this cell';
            } else {
                // Not reached yet (e.g. after a rebirth): keep it hidden and closed
                it.entry.classList.remove('expanded');
                it.row.removeAttribute('role');
                it.row.removeAttribute('tabindex');
                it.row.removeAttribute('aria-expanded');
                it.row.title = `Reach ${withCommas(STAGES[i].min)} total mutation levels to discover this stage`;
            }
        });
    }

    evolveTo(idx, animate) {
        this.currentStage = idx;
        this.badgeLabel.textContent = `Stage ${idx + 1}: ${STAGES[idx].name}`;
        this._badgeBox = null; // name changed, so the button's width did too
        this.updateStageProgress();

        if (!animate) {
            this.cells.forEach(c => this.applyStage(c, idx));
            this.layoutMass();
            this.scheduleJunctions(0);
            return;
        }

        restartAnim(this.badge, 'pop');
        let maxDelay = 0;
        this.cells.forEach(c => {
            const delay = c.ring * 110;
            maxDelay = Math.max(maxDelay, delay);
            setTimeout(() => {
                restartAnim(c.body, 'evolving');
                restartAnim(c.feat, 'evolving');
                this.spawnRing(c, STAGES[this.currentStage]);
                setTimeout(() => this.applyStage(c, this.currentStage), 225);
            }, delay);
        });
        setTimeout(() => this.layoutMass(), 225);
        this.scheduleJunctions(maxDelay + 950);
    }

    // Mitosis: a new cell buds off its nearest neighbour and the whole mass re-centres
    addCell() {
        const prevPositions = this.cells.map(c => ({ x: c.x, y: c.y }));
        const cell = this.createCell(this.cells.length);
        this.applyStage(cell, this.currentStage);

        // Find the neighbour it divides from (closest existing cell in the new layout)
        const n = this.cells.length;
        const slot = HEX_SLOTS[n - 1];
        let parent = 0, best = Infinity;
        for (let i = 0; i < n - 1; i++) {
            const d = Math.hypot(HEX_SLOTS[i].x - slot.x, HEX_SLOTS[i].y - slot.y);
            if (d < best) { best = d; parent = i; }
        }
        const start = prevPositions[parent];
        [cell.feat, cell.body].forEach(node => {
            node.style.transition = 'none';
            node.style.left = (start.x - 100) + 'px';
            node.style.top = (start.y - 100) + 'px';
            node.style.transform = 'scale(0.25)';
            node.style.opacity = '0';
        });
        void cell.body.offsetWidth;
        [cell.feat, cell.body].forEach(node => {
            node.style.transition = '';
            node.style.transform = '';
            node.style.opacity = '';
        });

        this.layoutMass();
        setTimeout(() => this.spawnRing(cell, STAGES[this.currentStage], 0.8), 450);
        this.scheduleJunctions(800);
    }

    // Brings the number of cells in line with Mitotic Division (no budding animation; used for loads/resets)
    syncCellCount() {
        const want = this.cellCount();
        while (this.cells.length > want) {
            const c = this.cells.pop();
            c.feat.remove();
            c.body.remove();
        }
        while (this.cells.length < want) this.createCell(this.cells.length);
    }

    // Rebuilds the mass to match the current levels. burst = new cells fan out from the centre.
    rebuildMass(burst) {
        if (!burst) this.massEl.classList.add('no-anim');
        const had = this.cells.length;
        this.syncCellCount();
        if (burst && this.cells.length > had) void this.massEl.offsetWidth; // start new cells at the centre
        const idx = stageForLevels(this.totalLevels());
        this.currentStage = -1;
        this.evolveTo(idx, false);
        if (!burst) {
            void this.massEl.offsetWidth;
            requestAnimationFrame(() => this.massEl.classList.remove('no-anim'));
        }
    }

    setCooldown(on) {
        this.massEl.classList.toggle('cooldown', on);
    }

    // Semi-springy squash and rebound. Fits inside the click cooldown, and restarts on every click so fast
    // or butterfly clicking keeps the cells visibly bouncing.
    // Each cell keeps its bounce animation and simply rewinds it on the next click (creating 37 new
    // animations per click was a big cost on slow machines). It is only rebuilt when its kind
    // (strong for the clicked cell, soft for the rest) or its length changes.
    spring(clickedIdx) {
        const dur = Math.min(320, Math.max(110, this.stats.clickCooldown * 0.95));
        this.cells.forEach((c, i) => {
            const kind = (i === clickedIdx || clickedIdx < 0) ? 'strong' : 'soft';
            if (c.spring && c.springKind === kind && c.springDur === dur) {
                c.spring.currentTime = 0;
                c.spring.play();
                return;
            }
            if (c.spring) c.spring.cancel();
            c.spring = c.glow.animate(kind === 'strong' ? SPRING_STRONG : SPRING_SOFT, { duration: dur });
            c.springKind = kind;
            c.springDur = dur;
        });
    }

    nearestCell(px, py) {
        const ox = paneW / 2, oy = paneH / 2;
        let best = Infinity, idx = -1;
        this.cells.forEach((c, i) => {
            const d = Math.hypot(ox + c.x * this.massScale - px, oy + c.y * this.massScale - py);
            if (d < best) { best = d; idx = i; }
        });
        return idx;
    }

    // Shows the base amount made above every cell in the mass
    spawnFloaters(px, py, clicked, amount, color) {
        const ox = paneW / 2, oy = paneH / 2;
        const sp = floaterSprite(fmtFloat(amount), color || MANUAL_COLOR); // same text for every cell: format it once
        const t0 = performance.now();
        this.cells.forEach((c, i) => {
            if (i === clicked) {
                fxAdd(this.index, px, py - 12, sp, t0);
            } else {
                fxAdd(this.index,
                    ox + c.x * this.massScale + (Math.random() * 40 - 20),
                    oy + c.y * this.massScale + (Math.random() * 40 - 20), sp, t0);
            }
        });
    }

    // ---------- Manual click ----------
    handleClick(e) {
        if (slideAnim) return;
        if (game.pending) {
            if (this.index === 0) endPending();
            return;
        }
        if (!this.unlocked || game.view !== this.index) return;

        const now = performance.now();
        const s = this.stats;
        if (now - this.lastClickTime < s.clickCooldown) return;
        this.lastClickTime = now;

        const crit = s.critChance > 0 && Math.random() * 100 < s.critChance;
        const perCell = this.manualPerCell() * (crit ? this.critMult() : 1);
        game.money += perCell * this.cellCount();

        // Pane position is cached (reading it here would force the browser to re-measure the page every click)
        const px = e.clientX - paneLeft, py = e.clientY - paneTop;
        const clicked = this.nearestCell(px, py);
        this.spawnFloaters(px, py, clicked, perCell, crit ? CRIT_COLOR : null);
        this.spring(clicked);
        fxRipple(this.index, px, py, crit ? CRIT_COLOR : STAGES[this.currentStage].grad[0], crit);
        if (crit) bump(dnaCounter);

        // Visual feedback for Cooldown trigger
        this.setCooldown(true);
        clearTimeout(this.cooldownTimer);
        this.cooldownTimer = setTimeout(() => this.setCooldown(false), s.clickCooldown);
    }

    // ---------- Passive generation (time based, so it keeps up even when frames are skipped) ----------
    tick(now) {
        const s = this.stats;
        if (!this.unlocked || game.pending || s.autoPower <= 0) { this.lastAutoTime = now; return; }
        const cd = s.autoCooldown;
        const elapsed = now - this.lastAutoTime;
        if (elapsed < cd) return;
        const n = Math.floor(elapsed / cd);
        this.lastAutoTime = n > 100000 ? now : this.lastAutoTime + n * cd;

        const base = this.passivePerCell();
        const cells = this.cellCount();
        const cm = this.critMult();
        const p = s.autoCritChance / 100;
        let lastPer = base, lastCrit = false;
        if (n <= 5) {
            let total = 0;
            for (let i = 0; i < n; i++) {
                const crit = p > 0 && Math.random() < p;
                lastPer = base * (crit ? cm : 1);
                lastCrit = crit;
                total += lastPer;
            }
            game.money += total * cells;
        } else {
            // Catching up after the tab was in the background: use the average instead of rolling each tick
            game.money += base * cells * n * (1 + p * (cm - 1));
        }
        if (n <= 5 && game.view === this.index && !document.hidden && !slideAnim) {
            this.spawnFloaters(0, 0, -1, lastPer, lastCrit ? AUTO_CRIT_COLOR : PASSIVE_COLOR); // Different tint for passive gains
        }
    }

    // ---------- Unlocking (colonies II and III) ----------
    updateLock() {
        if (!this.lockBtn || this.unlocked) return;
        const afford = !game.pending && game.money >= this.def.unlockCost;
        if (afford !== this.lockAfford) {
            this.lockAfford = afford;
            this.lockBtn.classList.toggle('affordable', afford);
        }
    }

    tryUnlock() {
        if (this.unlocked || this.unlocking || game.pending || slideAnim) return;
        if (game.money < this.def.unlockCost) {
            restartAnim(this.lockBtn, 'denied');
            return;
        }
        playSoftTink();
        game.money -= this.def.unlockCost;
        displayMoney = Math.min(displayMoney, game.money);
        this.unlocking = true;
        this.lockBtn.classList.add('unlocking');

        // The shackle springs open, then the grey drains away quickly
        setTimeout(() => {
            this.overlay.classList.add('gone');
            this.screen.classList.remove('locked');
            this.unlocked = true;
            this.lastAutoTime = performance.now();
            this.applyCycleStart();
            if (game.view === this.index) showGroup();
            this.cells.forEach(c => this.spawnRing(c, STAGES[this.currentStage]));
            save();
        }, 520);
        setTimeout(() => {
            this.overlay.classList.add('removed');
            this.unlocking = false;
        }, 1000);
    }

    unlockSilently() {
        if (this.unlocked) return;
        this.unlocked = true;
        this.screen.classList.remove('locked');
        this.overlay.classList.add('gone', 'removed');
        this.lastAutoTime = performance.now();
    }

    relock() {
        if (this.index === 0) return;
        this.unlocked = false;
        this.unlocking = false;
        this.lockAfford = null;
        this.screen.classList.add('locked');
        this.overlay.classList.remove('gone', 'removed');
        this.lockBtn.classList.remove('unlocking', 'affordable', 'denied');
    }

    // ---------- Cycle handling ----------
    // Starting levels granted by rebirth upgrades
    applyCycleStart() {
        const L = this.levels;
        if (has('reflex')) { L.clickCooldown = UP.clickCooldown.max; L.autoClickCooldown = UP.autoClickCooldown.max; }
        if (has('budding')) L.extraCells = Math.max(L.extraCells, 6);
        if (has('hereditary')) { L.clickPower = Math.max(L.clickPower, 25); L.autoClickPower = Math.max(L.autoClickPower, 25); }
        this.recalc();
        this.version++;
        this.rebuildGroup();
        this.rebuildMass(true);
    }

    resetCycle() {
        UPGRADES.forEach(u => { this.levels[u.key] = 0; });
        this.recalc();
        this.version++;
        clearTimeout(this.cooldownTimer);
        this.setCooldown(false);
        this.cells.forEach(c => { if (c.spring) c.spring.cancel(); });
        this.relock();
        this.rebuildGroup();
        this.rebuildMass(false);
        this.lastAutoTime = performance.now();
    }

    // ---------- Visibility (offscreen colonies stop painting and pause their SVG animations) ----------
    pauseSvgs(...roots) {
        roots.forEach(r => r.querySelectorAll('svg').forEach(svg => { if (svg.pauseAnimations) svg.pauseAnimations(); }));
    }
    setVisible(v) {
        const was = !this.screen.classList.contains('offscreen');
        if (was === v) return;
        this.screen.classList.toggle('offscreen', !v);
        this.screen.querySelectorAll('svg').forEach(svg => {
            if (v) { if (svg.unpauseAnimations) svg.unpauseAnimations(); }
            else if (svg.pauseAnimations) svg.pauseAnimations();
        });
    }
}

// =====================================================================
// FLOATING YIELDS, RIPPLES & SPARKS (drawn on one canvas: far cheaper than hundreds of DOM nodes)
// =====================================================================
const fx = {
    canvas: document.getElementById('fx-canvas'),
    ctx: null, dpr: 1,
    floaters: [], ripples: [], sparks: [],
    sprites: new Map(),
    measure: document.createElement('canvas').getContext('2d'),
    dirty: false
};
fx.ctx = fx.canvas.getContext('2d');
const FLOAT_MS = 800;
const MAX_FLOATERS = 700;
const FLOAT_FONT = "800 24px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
const ICON_STRANDS = [new Path2D('M2 1 C2 5.5 10 5.5 10 10 C10 14.5 2 14.5 2 19'), new Path2D('M10 1 C10 5.5 2 5.5 2 10 C2 14.5 10 14.5 10 19')];
const ICON_RUNGS = new Path2D('M3.2 2.8h5.6 M2.6 10h6.8 M3.2 17.2h5.6');

// CSS "ease-out" (cubic-bezier(0, 0, 0.58, 1)) as a lookup table, to match the original float animation
const EASE_OUT_LUT = (function () {
    const N = 128, out = new Float32Array(N + 1);
    const bez = (t, p1, p2) => 3 * (1 - t) * (1 - t) * t * p1 + 3 * (1 - t) * t * t * p2 + t * t * t;
    let k = 0;
    for (let i = 0; i <= 1000; i++) {
        const t = i / 1000, x = bez(t, 0, 0.58), y = bez(t, 0, 1);
        while (k <= N && k / N <= x) { out[k++] = y; }
    }
    while (k <= N) out[k++] = 1;
    return out;
})();
function easeOutCss(t) { return EASE_OUT_LUT[Math.min(128, Math.max(0, Math.round(t * 128)))]; }

// Pre-renders "+[DNA]123" once per amount/colour; every floater is then a single drawImage
function floaterSprite(text, color) {
    const key = color + '|' + text;
    let sp = fx.sprites.get(key);
    if (sp) return sp;
    if (fx.sprites.size > 600) fx.sprites.clear();

    const m = fx.measure;
    m.font = FLOAT_FONT;
    const plusW = m.measureText('+').width;
    const numW = m.measureText(text).width;
    const iconW = 13.2, gap = 2.9, pad = 6, h = 40, base = 28;
    const w = Math.ceil(pad * 2 + plusW + iconW + gap + numW);

    const c = document.createElement('canvas');
    c.width = Math.ceil(w * fx.dpr);
    c.height = Math.ceil(h * fx.dpr);
    const g = c.getContext('2d');
    g.scale(fx.dpr, fx.dpr);
    g.font = FLOAT_FONT;
    g.shadowColor = 'rgba(0, 0, 0, 0.45)';
    g.shadowBlur = 4;
    g.shadowOffsetY = 1;
    g.fillStyle = color;
    g.fillText('+', pad, base);
    g.save();
    g.translate(pad + plusW + 0.12, base - 19.2);
    g.scale(1.08, 1.08);
    g.strokeStyle = color;
    g.lineCap = 'round';
    g.lineWidth = 1.8;
    g.stroke(ICON_STRANDS[0]);
    g.stroke(ICON_STRANDS[1]);
    g.globalAlpha = 0.85;
    g.lineWidth = 1.3;
    g.stroke(ICON_RUNGS);
    g.restore();
    g.fillText(text, pad + plusW + iconW + gap, base);

    sp = { c, w, h };
    fx.sprites.set(key, sp);
    return sp;
}

function fxAdd(screen, x, y, sp, t0) {
    fx.floaters.push({ screen, x, y, t0, sp });
    if (fx.floaters.length > MAX_FLOATERS) fx.floaters.splice(0, fx.floaters.length - MAX_FLOATERS);
}
function fxFloater(screen, x, y, amount, color) {
    fxAdd(screen, x, y, floaterSprite(fmtFloat(amount), color || MANUAL_COLOR), performance.now());
}

// Cell bounce keyframes, built once and shared by every cell
function springFrames(a, b) {
    return [
        { transform: 'scale(1)', easing: 'cubic-bezier(0.2, 0.8, 0.4, 1)' },
        { transform: `scale(${a})`, offset: 0.22, easing: 'cubic-bezier(0.3, 0.6, 0.4, 1)' },
        { transform: `scale(${b})`, offset: 0.55, easing: 'ease-in-out' },
        { transform: 'scale(0.99)', offset: 0.8, easing: 'ease-out' },
        { transform: 'scale(1)' }
    ];
}
const SPRING_STRONG = springFrames(0.86, 1.06);
const SPRING_SOFT = springFrames(0.94, 1.025);

// Header counter "bump" (same motion as the .bump CSS animation) without forcing a page re-measure
const BUMP_FRAMES = [
    { transform: 'scale(1)', easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)' },
    { transform: 'scale(1.07)', offset: 0.4, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)' },
    { transform: 'scale(1)' }
];
function bump(node) {
    if (node._bump) { node._bump.currentTime = 0; node._bump.play(); }
    else node._bump = node.animate(BUMP_FRAMES, { duration: 320 });
}

function fxRipple(screen, x, y, color, crit) {
    const now = performance.now();
    fx.ripples.push({ screen, x, y, t0: now, color, size: crit ? 70 : 46 });
    if (crit) {
        for (let i = 0; i < 12; i++) {
            const a = Math.random() * Math.PI * 2, v = 140 + Math.random() * 160;
            fx.sparks.push({ screen, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t0: now, color });
        }
    }
}

function renderFx(now) {
    const ctx = fx.ctx;
    if (!fx.floaters.length && !fx.ripples.length && !fx.sparks.length) {
        if (fx.dirty) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, fx.canvas.width, fx.canvas.height); fx.dirty = false; }
        return;
    }
    fx.dirty = true;
    ctx.setTransform(fx.dpr, 0, 0, fx.dpr, 0, 0);
    ctx.clearRect(0, 0, paneW, paneH);

    // Draw everywhere except over the stage buttons on screen
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, paneW, paneH);
    colonies.forEach((c, i) => {
        const d = i - slidePos;
        if (Math.abs(d) >= 1) return;
        const b = c.badgeBox();
        ctx.rect(b.x + d * paneW, b.y, b.w, b.h);
    });
    ctx.clip('evenodd');

    // Ripples
    let j = 0;
    for (let i = 0; i < fx.ripples.length; i++) {
        const r = fx.ripples[i];
        const t = Math.max(0, (now - r.t0) / 450);
        if (t >= 1) continue;
        fx.ripples[j++] = r;
        const e = 1 - Math.pow(1 - t, 3);
        ctx.globalAlpha = 0.55 * (1 - t);
        ctx.strokeStyle = r.color;
        ctx.lineWidth = 3 * (1 - t) + 0.5;
        ctx.beginPath();
        ctx.arc(r.x + (r.screen - slidePos) * paneW, r.y, 8 + r.size * e, 0, Math.PI * 2);
        ctx.stroke();
    }
    fx.ripples.length = j;

    // Crit sparks
    j = 0;
    for (let i = 0; i < fx.sparks.length; i++) {
        const s = fx.sparks[i];
        const t = Math.max(0, (now - s.t0) / 550);
        if (t >= 1) continue;
        fx.sparks[j++] = s;
        const e = 1 - Math.pow(1 - t, 2);
        const d = e * 0.55;
        ctx.globalAlpha = 1 - t;
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x + s.vx * d + (s.screen - slidePos) * paneW, s.y + s.vy * d, 3 * (1 - t) + 0.6, 0, Math.PI * 2);
        ctx.fill();
    }
    fx.sparks.length = j;

    // Floating yields: rise 100px, shrink to 80% and fade over 0.8s (same motion as before)
    j = 0;
    const arr = fx.floaters;
    for (let i = 0; i < arr.length; i++) {
        const f = arr[i];
        const t = Math.max(0, (now - f.t0) / FLOAT_MS);
        if (t >= 1) continue;
        arr[j++] = f;
        const e = easeOutCss(t);
        const s = 1 - 0.2 * e;
        const w = f.sp.w * s, h = f.sp.h * s;
        ctx.globalAlpha = 1 - e;
        ctx.drawImage(f.sp.c, f.x + (f.screen - slidePos) * paneW - w / 2, f.y - 100 * e - h / 2, w, h);
    }
    arr.length = j;
    ctx.globalAlpha = 1;
    ctx.restore();
}

// =====================================================================
// AMBIENT BACKGROUND (soft drifting particles)
// =====================================================================
const amb = {
    canvas: document.getElementById('ambient-canvas'),
    ctx: null, parts: [], sprite: null
};
amb.ctx = amb.canvas.getContext('2d');
(function initAmbient() {
    const s = document.createElement('canvas');
    s.width = s.height = 64;
    const g = s.getContext('2d');
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(186, 214, 255, 1)');
    grad.addColorStop(0.35, 'rgba(120, 160, 230, 0.45)');
    grad.addColorStop(1, 'rgba(120, 160, 230, 0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    amb.sprite = s;
    for (let i = 0; i < 38; i++) {
        amb.parts.push({
            x: Math.random(), y: Math.random(),
            size: 6 + Math.random() * 22,
            vy: 0.004 + Math.random() * 0.012,
            alpha: 0.05 + Math.random() * 0.17,
            freq: 0.15 + Math.random() * 0.35,
            phase: Math.random() * Math.PI * 2,
            depth: 0.3 + Math.random() * 0.7
        });
    }
})();

function renderAmbient(now, dt) {
    const ctx = amb.ctx;
    ctx.setTransform(fx.dpr, 0, 0, fx.dpr, 0, 0);
    ctx.clearRect(0, 0, paneW, paneH);
    const tSec = now / 1000;
    for (let i = 0; i < amb.parts.length; i++) {
        const p = amb.parts[i];
        p.y -= p.vy * dt;
        if (p.y < -0.06) { p.y = 1.06; p.x = Math.random(); }
        // Gentle parallax as the screens slide
        let x = (p.x * paneW + Math.sin(tSec * p.freq + p.phase) * 14 - slidePos * paneW * 0.12 * p.depth) % paneW;
        if (x < 0) x += paneW;
        ctx.globalAlpha = p.alpha;
        ctx.drawImage(amb.sprite, x - p.size / 2, p.y * paneH - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
}

// =====================================================================
// SCREENS & SLIDING
// =====================================================================
let paneW = 0, paneH = 0;
let paneLeft = 0, paneTop = 0; // cached on resize so clicks never force a page re-measure
let slidePos = 0;
let slideAnim = null;
const colonies = [];

function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

function applySlide() {
    colonies.forEach((c, i) => {
        const d = i - slidePos;
        const ad = Math.min(1, Math.abs(d));
        c.screen.style.transform = `translate3d(${(d * 100).toFixed(3)}%, 0, 0) scale(${(1 - 0.06 * ad).toFixed(4)})`;
        c.screen.style.opacity = (1 - 0.4 * ad).toFixed(3);
    });
}

function goToScreen(i, instant) {
    i = Math.max(0, Math.min(colonies.length - 1, i));
    if (game.pending && i !== 0) return;
    if (i === game.view && !instant) return;
    closeStageMenus();
    const from = slidePos;
    game.view = i;
    // Everything the slide passes over must be visible while it moves
    const lo = Math.min(Math.floor(from), i), hi = Math.max(Math.ceil(from), i);
    colonies.forEach((c, k) => { if (k >= lo && k <= hi) c.setVisible(true); });
    if (instant) {
        slidePos = i;
        slideAnim = null;
        applySlide();
        finishSlide();
    } else {
        slideAnim = { from, to: i, t0: performance.now(), dur: 720 };
    }
    showGroup();
    updateArrows();
}

function updateSlide(now) {
    if (!slideAnim) return;
    const t = Math.min(1, (now - slideAnim.t0) / slideAnim.dur);
    slidePos = slideAnim.from + (slideAnim.to - slideAnim.from) * easeInOutCubic(t);
    applySlide();
    if (t >= 1) {
        slidePos = slideAnim.to;
        slideAnim = null;
        finishSlide();
    }
}

function finishSlide() {
    colonies.forEach((c, k) => c.setVisible(k === game.view));
}

function closeStageMenus() {
    colonies.forEach(c => c.closeStageMenu());
}
// Clicking anywhere outside an open stage list closes it
document.addEventListener('pointerdown', closeStageMenus);

function updateArrows() {
    navLeft.classList.toggle('hidden', game.pending || game.view === 0);
    navRight.classList.toggle('hidden', game.pending || game.view === colonies.length - 1);
}

navLeft.addEventListener('click', () => goToScreen(game.view - 1));
navRight.addEventListener('click', () => goToScreen(game.view + 1));

// Which list the mutations pane shows: the viewed colony's mutations, or the rebirth mutations
function showGroup() {
    const c = colonies[game.view];
    const target = game.pending ? rebirthGroup : c.group;
    [...colonies.map(k => k.group), rebirthGroup].forEach(g => {
        if (g === target) {
            if (!g.classList.contains('active')) { g.classList.add('active'); upgradesContainer.scrollTop = 0; }
        } else {
            g.classList.remove('active');
        }
    });
    setText(paneTitle, game.pending ? 'Rebirth Mutations' : 'Mutations');
    paneTitle.classList.toggle('rebirth-mode', game.pending);
    upgradesPane.classList.toggle('greyed', !game.pending && !c.unlocked);
    rebirthBar.classList.toggle('hidden', game.pending);
}

// =====================================================================
// REBIRTH
// =====================================================================
const rebirthGroup = el('div', 'upgrade-group');
upgradesContainer.appendChild(rebirthGroup);
const rebirthCards = [];

function rebirthEffect(def) {
    if (def.id === 'echo') return `×${(1 + 0.02 * game.rdnaEarned).toFixed(2)} now`;
    return def.effect;
}

(function buildRebirthCards() {
    REBIRTH_UPGRADES.forEach(def => {
        const card = el('div', 'upgrade-card rebirth');
        card.innerHTML =
            `<div class="upgrade-info">` +
                `<div class="upgrade-name">${def.label}</div>` +
                `<div class="upgrade-desc">${def.desc}</div>` +
                `<div class="upgrade-meta"><span class="meta-lvl">Permanent</span><span class="meta-effect"></span></div>` +
            `</div>` +
            `<button class="upgrade-btn" type="button"></button>`;
        const ref = { def, card, btn: card.querySelector('.upgrade-btn'), lvl: card.querySelector('.meta-lvl'), eff: card.querySelector('.meta-effect'), state: null, p: -1 };
        ref.btn.addEventListener('click', () => { playSoftTink(); buyRebirthUpgrade(ref); });
        card.addEventListener('animationend', (e) => { if (e.target === card) card.classList.remove('bought'); });
        rebirthGroup.appendChild(card);
        rebirthCards.push(ref);
    });
})();

function updateRebirthCards() {
    rebirthCards.forEach(r => {
        const owned = has(r.def.id);
        const afford = !owned && game.rdna >= r.def.cost;
        const state = owned ? 'owned' : (afford ? 'afford' : 'locked');
        setHTML(r.eff, rebirthEffect(r.def));
        if (state !== r.state) {
            r.state = state;
            r.card.classList.toggle('owned', owned);
            r.card.classList.toggle('affordable', afford);
            r.btn.disabled = !afford;
            setText(r.lvl, owned ? 'Owned' : 'Permanent');
            setHTML(r.btn, owned ? 'OWNED' : `${RNA_ICON}${withCommas(r.def.cost)}`);
        }
        const p = state === 'locked' ? Math.floor(Math.min(1, game.rdna / r.def.cost) * 50) * 2 : 0;
        if (p !== r.p) { r.p = p; r.btn.style.setProperty('--p', p + '%'); }
    });
}

function buyRebirthUpgrade(ref) {
    const def = ref.def;
    if (has(def.id) || game.rdna < def.cost) return;
    game.rdna -= def.cost;
    game.owned.add(def.id);
    costEpoch++;
    restartAnim(ref.card, 'bought');
    bump(rdnaCounter);
    updateRebirthCards();
    save();
}

// RNA earned for the DNA held right now (grows with every extra trillion you hold)
function rebirthGain() {
    return game.money >= REBIRTH_REQ ? Math.sqrt(game.money / REBIRTH_REQ) : 0;
}

let confirmArmed = 0;
rebirthBtn.addEventListener('click', () => {
    if (game.pending || game.money < REBIRTH_REQ) return;
    if (!confirmArmed) {
        confirmArmed = performance.now();
        return;
    }
    confirmArmed = 0;
    doRebirth();
});

function updateRebirthButton(now) {
    if (game.pending) return;
    const ready = game.money >= REBIRTH_REQ;
    if (confirmArmed && (!ready || now - confirmArmed > 4000)) confirmArmed = 0;
    let title, sub, p;
    if (!ready) {
        title = 'Rebirth';
        sub = `Requires ${DNA_ICON}${fmtLongTrim(REBIRTH_REQ)}`;
        p = Math.floor(game.money / REBIRTH_REQ * 200) / 2;
    } else {
        const total = rebirthGain() + game.rdnaFrac;
        const whole = Math.floor(total);
        const dec = Math.floor((total - whole) * 100) / 100; // two decimals, rounded down so it never overstates
        const amount = withCommas(whole) + (dec > 0 ? dec.toFixed(2).slice(1) : '');
        title = confirmArmed ? 'Click again to confirm' : 'Rebirth';
        sub = confirmArmed
            ? 'Resets mutations and colonies. Rebirth mutations are kept.'
            : `Gain +${amount} <span style="color:var(--rebirth-text)">${RNA_ICON}</span>RNA`;
        p = 100;
    }
    setText(rbTitle, title);
    setHTML(rbSub, sub);
    rebirthBtn.classList.toggle('ready', ready);
    rebirthBtn.classList.toggle('confirm', !!confirmArmed);
    const pw = p + '%';
    if (rbFill._w !== pw) { rbFill._w = pw; rbFill.style.width = pw; }
}

function doRebirth() {
    if (game.pending || game.money < REBIRTH_REQ) return;

    // Whole RNA is paid out; any decimal is stored and added to the next rebirth's decimal
    const total = rebirthGain() + game.rdnaFrac;
    const whole = Math.floor(total);
    game.rdnaFrac = Math.max(0, total - whole);
    game.rdna += whole;
    game.rdnaEarned += whole;
    game.rebirths++;

    restartAnim(rebirthFlash, 'go');
    setTimeout(() => {
        game.money = 0;
        displayMoney = 0;
        game.pending = true;
        colonies.forEach(c => c.resetCycle());
        colonies[0].screen.classList.add('dormant');
        goToScreen(0, slidePos === 0);
        costEpoch++;
        showGroup();
        updateArrows();
        updateRebirthCards();
        restartAnim(rdnaCounter, 'bump');
        const dec = Math.floor((total - whole) * 100) / 100;
        const amount = withCommas(whole) + (dec > 0 ? dec.toFixed(2).slice(1) : '');
        toast(`Reborn! +${amount} <span style="color:var(--rebirth)">${RNA_ICON}</span>RNA`, true);
        save();
    }, 380);
}

// Clicking the dormant cell starts the next cycle
function endPending() {
    if (!game.pending) return;
    game.pending = false;
    const c0 = colonies[0];
    c0.screen.classList.remove('dormant');
    if (has('reserve')) game.money += 1e6;
    if (has('colony2')) colonies[1].unlockSilently();
    if (has('colony3')) colonies[2].unlockSilently();
    colonies.forEach(c => {
        if (!c.unlocked) return;
        c.lastAutoTime = performance.now();
        c.applyCycleStart();
    });
    c0.spring(-1);
    c0.cells.forEach(c => c0.spawnRing(c, STAGES[c0.currentStage]));
    costEpoch++;
    statsDirty = true;
    showGroup();
    updateArrows();
    save();
}

// =====================================================================
// HEADER, TOASTS, UI LOOP
// =====================================================================
function toast(html, purple) {
    const t = el('div', 'toast' + (purple ? ' purple' : ''));
    t.innerHTML = html;
    toastStack.appendChild(t);
    setTimeout(() => t.classList.add('out'), 3400);
    setTimeout(() => t.remove(), 3900);
}

let statsDirty = true;
let lastStatsTime = 0;

function renderUI(now, dt) {
    // Header DNA counter rolls smoothly up to the real value (spending snaps instantly)
    if (displayMoney < game.money) {
        displayMoney += (game.money - displayMoney) * Math.min(1, dt * 14);
        if (game.money - displayMoney < 1 || (game.money - displayMoney) / game.money < 1e-7) displayMoney = game.money;
    } else {
        displayMoney = game.money;
    }
    setText(dnaValue, fmtLong(displayMoney));
    setText(rdnaValue, fmtLong(game.rdna));

    if (statsDirty || now - lastStatsTime > 250) {
        statsDirty = false;
        lastStatsTime = now;
        // Calculate and display passive performance per second (all colonies)
        const dps = colonies.reduce((a, c) => a + c.passivePerSecond(), 0);
        setHTML(dpsCounter, `Generation Rate: ${DNA_ICON}${fmtRate(dps)}/s`);
    }

    const c = colonies[game.view];
    if (game.pending) updateRebirthCards();
    else c.updateButtons();
    c.updateLock();
    updateRebirthButton(now);
}

function resizeCanvases() {
    const rect = simPane.getBoundingClientRect();
    paneW = rect.width;
    paneH = rect.height;
    paneLeft = rect.left;
    paneTop = rect.top;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    if (dpr !== fx.dpr) { fx.dpr = dpr; fx.sprites.clear(); }
    [fx.canvas, amb.canvas].forEach(cv => {
        cv.width = Math.round(paneW * dpr);
        cv.height = Math.round(paneH * dpr);
    });
}

let resizeTimer = null;
window.addEventListener('resize', () => {
    resizeCanvases();
    colonies.forEach(c => { c._badgeBox = null; c.layoutMass(); });
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => colonies.forEach(c => c.scheduleJunctions(0)), 750);
});

// Game Loops
let lastFrame = performance.now();
function frame(now) {
    // Book the next frame first, so a hiccup in one part can never stop the whole game
    requestAnimationFrame(frame);
    const dt = Math.min(0.1, Math.max(0, (now - lastFrame) / 1000));
    lastFrame = now;
    colonies.forEach(c => c.tick(now));
    updateSlide(now);
    try { renderAmbient(now, dt); } catch (e) { console.error(e); }
    try { renderFx(now); } catch (e) { console.error(e); }
    renderUI(now, dt);
}
// Background tabs pause animation frames, so keep passive income flowing with a slow timer
setInterval(() => {
    if (document.hidden) {
        const now = performance.now();
        colonies.forEach(c => c.tick(now));
    }
}, 1000);

// Wrapper function to execute your game logic and play the sound simultaneously
function handleUpgradeClick(colony, key) {
    playSoftTink();       // Plays the synthy, quiet downward "ch-tink"
    colony.buy(key);      // Runs the upgrade purchase
}

// =====================================================================
// SAVE / LOAD (progress is kept in this browser)
// =====================================================================
// The save is written to two places in the browser: localStorage (instant) and IndexedDB (a backup copy).
// On start the newer of the two is restored.
let saveBlocked = false;
let saveTimer = null;

const backupDb = {
    promise: null,
    open() {
        if (!this.promise) {
            this.promise = new Promise((resolve, reject) => {
                try {
                    const req = indexedDB.open('cellEvoClicker', 1);
                    req.onupgradeneeded = () => req.result.createObjectStore('save');
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                } catch (e) { reject(e); }
            });
        }
        return this.promise;
    },
    async run(mode, fn) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
            const tx = db.transaction('save', mode);
            const req = fn(tx.objectStore('save'));
            tx.oncomplete = () => resolve(req && req.result);
            tx.onerror = () => reject(tx.error);
        });
    },
    write(json) { return this.run('readwrite', s => s.put(json, SAVE_KEY)).catch(() => {}); },
    read() { return this.run('readonly', s => s.get(SAVE_KEY)).catch(() => null); },
    clear() { return this.run('readwrite', s => s.delete(SAVE_KEY)).catch(() => {}); }
};

function save() {
    if (saveBlocked) return;
    clearTimeout(saveTimer);
    const json = JSON.stringify({
        v: 2,
        t: Date.now(),
        money: game.money,
        rdna: game.rdna,
        frac: game.rdnaFrac,
        earned: game.rdnaEarned,
        rebirths: game.rebirths,
        owned: [...game.owned],
        pending: game.pending,
        view: game.view,
        colonies: colonies.map(c => ({ unlocked: c.unlocked, levels: c.levels }))
    });
    try { localStorage.setItem(SAVE_KEY, json); } catch (e) { /* storage unavailable: the backup may still work */ }
    backupDb.write(json);
}
// Saves shortly after any purchase (grouped, so fast buying doesn't save dozens of times a second)
function requestSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 400);
}

function parseSave(json) {
    try {
        const d = typeof json === 'string' ? JSON.parse(json) : null;
        return d && d.v === 2 ? d : null;
    } catch (e) { return null; }
}
function readLocalSave() {
    try { return parseSave(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; }
}

function load(d) {
    if (!d) return null;
    const num = (v) => (typeof v === 'number' && isFinite(v) && v >= 0 ? v : 0);
    game.money = num(d.money);
    game.rdna = Math.floor(num(d.rdna));
    game.rdnaFrac = Math.min(0.999999, num(d.frac));
    game.rdnaEarned = Math.floor(num(d.earned));
    game.rebirths = Math.floor(num(d.rebirths));
    const valid = new Set(REBIRTH_UPGRADES.map(u => u.id));
    game.owned = new Set((Array.isArray(d.owned) ? d.owned : []).filter(id => valid.has(id)));
    game.pending = !!d.pending;
    (Array.isArray(d.colonies) ? d.colonies : []).forEach((cd, i) => {
        const c = colonies[i];
        if (!c || !cd) return;
        UPGRADES.forEach(u => {
            let v = Math.floor(num(cd.levels && cd.levels[u.key]));
            if (u.max !== null) v = Math.min(u.max, v);
            c.levels[u.key] = v;
        });
        if (i > 0 && cd.unlocked) c.unlockSilently();
        else if (i > 0) c.relock();
        c.recalc();
        c.version++;
        c.rebuildGroup();
        c.rebuildMass(false);
    });
    displayMoney = game.money;
    return d;
}

function grantOffline(d) {
    if (!d || !has('spores') || game.pending || !d.t) return;
    const secs = Math.min(OFFLINE_CAP_S, Math.max(0, (Date.now() - d.t) / 1000));
    if (secs < 30) return;
    const gain = colonies.reduce((a, c) => a + c.passivePerSecond(), 0) * secs * 0.5;
    if (gain <= 0) return;
    game.money += gain;
    const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60);
    toast(`While dormant for ${h ? h + 'h ' : ''}${m}m your spores made ${DNA_ICON}${fmtLong(gain)}`);
}

setInterval(save, 5000);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);
window.addEventListener('beforeunload', save);

// Applies a save to the running game and moves to the right screen
function restore(d, quiet) {
    if (!load(d)) return false;
    colonies[0].screen.classList.toggle('dormant', game.pending);
    grantOffline(d);
    goToScreen(game.pending ? 0 : Math.floor(num0(d.view)), true);
    updateRebirthCards();
    showGroup();
    updateArrows();
    statsDirty = true;
    if (!quiet) toast('Welcome back! Your progress was restored.');
    return true;
}
function num0(v) { return typeof v === 'number' && isFinite(v) ? Math.max(0, Math.min(2, v)) : 0; }

// Wipes all progress and starts over
async function resetGame() {
    saveBlocked = true;
    clearTimeout(saveTimer);
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { }
    await backupDb.clear();
    location.reload();
}
window.resetGame = resetGame;

// =====================================================================
// RESET CONFIRMATION (Esc). The game keeps running underneath while it is open.
// =====================================================================
const resetModal = document.getElementById('reset-modal');
const resetCancel = document.getElementById('reset-cancel');
const resetConfirm = document.getElementById('reset-confirm');
let lastFocus = null;

function openResetModal() {
    if (resetModal.classList.contains('open')) return;
    closeStageMenus();
    lastFocus = document.activeElement;
    resetModal.hidden = false;
    void resetModal.offsetWidth;
    resetModal.classList.add('open');
    resetCancel.focus();
}
function closeResetModal() {
    if (!resetModal.classList.contains('open')) return;
    resetModal.classList.remove('open');
    setTimeout(() => { if (!resetModal.classList.contains('open')) resetModal.hidden = true; }, 220);
    if (lastFocus && lastFocus.focus) lastFocus.focus();
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        e.preventDefault();
        if (resetModal.classList.contains('open')) closeResetModal();
        else openResetModal();
    } else if (e.key === 'Tab' && resetModal.classList.contains('open')) {
        // Keep keyboard focus inside the pop-up
        e.preventDefault();
        (document.activeElement === resetCancel ? resetConfirm : resetCancel).focus();
    }
});
resetCancel.addEventListener('click', closeResetModal);
resetConfirm.addEventListener('click', () => {
    resetConfirm.disabled = true;
    resetConfirm.textContent = 'Resetting…';
    resetGame();
});
resetModal.addEventListener('pointerdown', (e) => { if (e.target === resetModal) closeResetModal(); });

// =====================================================================
// EXECUTION START
// =====================================================================
resizeCanvases();
COLONY_DEFS.forEach((_, i) => colonies.push(new Colony(i)));
colonies.forEach(c => c.rebuildMass(false));

// Every cell area plays the soft pop on press
colonies.forEach(c => c.area.addEventListener('pointerdown', () => {
    if (c.unlocked || game.pending) playSoftClick();
}));

goToScreen(0, true);
updateRebirthCards();
showGroup();
updateArrows();

// Restore the newest save: localStorage right away, then check the backup copy in case it is newer
const localSave = readLocalSave();
restore(localSave, false);
backupDb.read().then(json => {
    const backup = parseSave(json);
    if (backup && (!localSave || backup.t > localSave.t + 1000)) restore(backup, false);
});

requestAnimationFrame(frame);
</script>
